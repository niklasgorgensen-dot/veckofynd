const sbAuth = supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
async function authHeaders(){
  const { data } = await sbAuth.auth.getSession();
  const s = data.session || null;
  const token = s ? s.access_token : SUPA_KEY;
  return { apikey: SUPA_KEY, Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
}
const supa = {
  async selectRaw(path){ const h = await authHeaders(); const r = await fetch(`${SUPA_URL}/rest/v1/${path}`, { headers: h }); return r.json(); },
  // Fetches every row of a query, paginated. Was sequential (one page, await,
  // next page, await...) -- with 30k+ deals and 29k+ product_store_links rows
  // that meant 60 round trips taken one at a time, ~14s just to open the app.
  // PostgREST returns the true row count in the Content-Range header when
  // asked (Prefer: count=exact), so the first page tells us how many pages
  // are left -- fire all of those concurrently instead of waiting in turn.
  async fetchAllPaginated(pathWithoutPaging){
    const pageSize = 1000;
    const h = await authHeaders();
    const firstUrl = `${SUPA_URL}/rest/v1/${pathWithoutPaging}&limit=${pageSize}&offset=0`;
    const firstRes = await fetch(firstUrl, { headers: { ...h, Prefer: 'count=exact' } });
    const firstPage = await firstRes.json();
    if(!Array.isArray(firstPage)) return [];
    const range = firstRes.headers.get('content-range'); // "0-999/30015"
    const total = range && range.includes('/') ? parseInt(range.split('/')[1], 10) : NaN;
    if(!Number.isFinite(total) || total <= firstPage.length) return firstPage;

    const pageCount = Math.ceil(total / pageSize);
    const requests = [];
    for(let p = 1; p < pageCount; p++){
      const offset = p * pageSize;
      requests.push(fetch(`${SUPA_URL}/rest/v1/${pathWithoutPaging}&limit=${pageSize}&offset=${offset}`, { headers: h }).then(r=>r.json()));
    }
    const restPages = await Promise.all(requests);
    let all = firstPage.slice();
    for(const page of restPages) if(Array.isArray(page)) all = all.concat(page);
    return all;
  },
  // Trimmed to the columns mapDealRow actually reads -- `select=*` was
  // pulling ean/limited_days/valid_from/scraped_at/source on every one of
  // 22k+ rows too (each JSON field repeats its key name per row, so 5 unused
  // columns cost real bytes at this scale: ~19% smaller payload measured on
  // a real 200-row sample). order=scraped_at.desc still works even though
  // scraped_at isn't selected -- PostgREST orders the underlying table, not
  // the projection.
  async fetchAllDeals(idsCsv, todayStr){
    const cols = 'id,store_id,product,detail,price,orig_price,unit,category,emoji,hot,valid_to,jamforpris,jamforenhet,brand,image_url,origin,promo_label';
    return this.fetchAllPaginated(`deals?select=${cols}&store_id=in.(${idsCsv})&or=(valid_to.is.null,valid_to.gte.${todayStr})&order=scraped_at.desc,id.asc`);
  },
  async fetchAllProductLinks(idsCsv){
    return this.fetchAllPaginated(`product_store_links?select=store_id,raw_product_text,product_id&store_id=in.(${idsCsv})`);
  },
  async fetchAllProducts(){
    return this.fetchAllPaginated(`products?select=id,image_url,brand,origin`);
  },
  async delete(table, id){ const h = await authHeaders(); await fetch(`${SUPA_URL}/rest/v1/${table}?id=eq.${id}`, { method:'DELETE', headers: h }); },
  async deleteWhere(table, filter){ const h = await authHeaders(); await fetch(`${SUPA_URL}/rest/v1/${table}?${filter}`, { method:'DELETE', headers: h }); },
  async update(table, id, data){ const h = await authHeaders(); await fetch(`${SUPA_URL}/rest/v1/${table}?id=eq.${id}`, { method:'PATCH', headers:{...h, Prefer:'return=minimal'}, body: JSON.stringify(data) }); },
  async insert(table, row){ const h = await authHeaders(); return fetch(`${SUPA_URL}/rest/v1/${table}`, { method:'POST', headers:{...h, Prefer:'resolution=merge-duplicates'}, body: JSON.stringify(row) }); }

// ── Analytics (see analytics_events / analytics_event_catalog in Supabase) ──

const ANALYTICS_SESSION_ID = crypto.randomUUID();
function track(eventName, properties, context, opts){
  opts = opts || {};
  const row = {
    event_id: crypto.randomUUID(),
    event_name: eventName,
    event_version: opts.version || 1,
    occurred_at: new Date().toISOString(),

    platform: 'web',
    app_version: APP_VERSION,
    source: opts.source || 'user_action',
    context: context || {},
    properties: properties || {},
  };
  try{ supa.insert('analytics_events', row).catch(()=>{ /* tyst, best-effort */ }); }catch(e){ /* tyst */ }
}

let listStores = []; // [{storeId, active}] for currentListId
let listItems = [];  // items for currentListId

// ── Deterministic store-optimization engine (no AI here, ever) ──────────
// Given the list's items and its active stores, decides which store each
// item should be bought at. A manual_store_override always wins outright.
// Otherwise candidate prices for an item come from the SAME canonical-
// product matching (product_store_links, built by match-products) that
// already powers the "cheaper elsewhere" badge -- reused here rather than
// reinvented, since it's the only real signal this app has for "is this
// the same product at another store." Items with no canonical match (e.g.
// a free-text manual entry with no matching offer anywhere) simply have no
// comparable price and stay pinned to their preferred/origin store.
function buildProductPriceIndex(){
  const byProduct = new Map();
  for(const d of ALL_DEALS){
    const pid = LINK_BY_KEY.get(`${d.store}::${d.product}`);
    if(!pid) continue;
    if(!byProduct.has(pid)) byProduct.set(pid, []);
    byProduct.get(pid).push(d);
  }
  return byProduct;
}
function candidatesForItem(item, priceIndex){
  let pid = null;
  if(item.dealId!=null){
    const origDeal = ALL_DEALS.find(d=>d.id===item.dealId);
    if(origDeal) pid = LINK_BY_KEY.get(`${origDeal.store}::${origDeal.product}`);
  }
  if(pid && priceIndex.has(pid)){
    return priceIndex.get(pid).map(d=>({ storeId:d.store, price:d.price, dealId:d.id, unit:d.unit }));
  }
  const fallbackStore = item.manualStoreOverride || item.preferredStoreId || item.recommendedStoreId;
  if(fallbackStore){
    return [{ storeId:fallbackStore, price:item.estimatedPrice, dealId:item.dealId, unit:item.unit }];
  }
  return [];
}
// Cheapest available candidate for an item restricted to a given store set
// (or all candidates if storeSet is null, i.e. unconstrained "cheapest" strategy).
function cheapestWithin(candidates, storeSet){
  const pool = storeSet ? candidates.filter(c=>storeSet.has(c.storeId)) : candidates;
  if(!pool.length) return null;
  return pool.reduce((best,c)=> (c.price==null ? best : (!best || (best.price!=null && c.price<best.price) || best.price==null) ? c : best), null);
}
function totalCostForStoreSet(itemCands, storeSet){
  let total = 0, unavailable = 0;
  const perStore = {};
  for(const {item, candidates} of itemCands){
    if(item.manualStoreOverride){
      const locked = candidates.find(c=>c.storeId===item.manualStoreOverride) || { storeId:item.manualStoreOverride, price:item.estimatedPrice||0 };
      total += (locked.price||0)*item.quantity; perStore[locked.storeId] = (perStore[locked.storeId]||0)+(locked.price||0)*item.quantity;
      continue;
    }
    const best = cheapestWithin(candidates, storeSet);
    if(!best || best.price==null){ unavailable++; continue; }
    total += best.price*item.quantity; perStore[best.storeId] = (perStore[best.storeId]||0)+best.price*item.quantity;
  }
  return { total, unavailable, perStore };
}
// Core entry point: returns { assignments:{itemId:{storeId,price,locked,available}}, perStoreTotal:{storeId:kr}, totalCost, unavailableCount }
function computeListOptimization(strategyOverride){
  const priceIndex = buildProductPriceIndex();
  const activeIds = activeListStoreIds();
  const itemCands = listItems.map(item=>({ item, candidates:candidatesForItem(item, priceIndex) }));
  const strategy = strategyOverride || (shoppingLists.find(l=>l.id===currentListId)||{}).strategy || 'cheapest';

  let chosenStoreSet = activeIds; // default: every active store is fair game (cheapest / balance start here)
  if(strategy==='single_store' && activeIds.size){
    let best = null;
    for(const sid of activeIds){
      const r = totalCostForStoreSet(itemCands, new Set([sid]));
      if(!best || r.unavailable<best.r.unavailable || (r.unavailable===best.r.unavailable && r.total<best.r.total)) best = { sid, r };
    }
    if(best) chosenStoreSet = new Set([best.sid]);
  } else if(strategy==='max2stores' && activeIds.size){
    const ids = Array.from(activeIds);
    let best = null;
    for(let i=0;i<ids.length;i++){
      const r1 = totalCostForStoreSet(itemCands, new Set([ids[i]]));
      if(!best || r1.unavailable<best.r.unavailable || (r1.unavailable===best.r.unavailable && r1.total<best.r.total)) best = { set:new Set([ids[i]]), r:r1 };
      for(let j=i+1;j<ids.length;j++){
        const pair = new Set([ids[i],ids[j]]);
        const r = totalCostForStoreSet(itemCands, pair);
        if(!best || r.unavailable<best.r.unavailable || (r.unavailable===best.r.unavailable && r.total<best.r.total)) best = { set:pair, r };
      }
    }
    if(best) chosenStoreSet = best.set;
  } else if(strategy==='balance' && activeIds.size){
    // Prefer the single best store unless spreading across every active
    // store saves more than a "is it worth another stop" threshold.
    let bestSingle = null;
    for(const sid of activeIds){
      const r = totalCostForStoreSet(itemCands, new Set([sid]));
      if(!bestSingle || r.unavailable<bestSingle.r.unavailable || (r.unavailable===bestSingle.r.unavailable && r.total<bestSingle.r.total)) bestSingle = { sid, r };
    }
    const allStores = totalCostForStoreSet(itemCands, activeIds);
    const worthIt = bestSingle && (bestSingle.r.total - allStores.total) > 20 * Math.max(1, activeIds.size-1);
    chosenStoreSet = worthIt ? activeIds : new Set([bestSingle.sid]);
  }
  // 'cheapest' strategy just uses activeIds unconstrained (set above).

  const assignments = {};
  const perStoreTotal = {};
  let totalCost = 0, unavailableCount = 0;
  for(const {item, candidates} of itemCands){
    if(item.manualStoreOverride){
      const locked = candidates.find(c=>c.storeId===item.manualStoreOverride) || { storeId:item.manualStoreOverride, price:item.estimatedPrice||0 };
      assignments[item.id] = { storeId:locked.storeId, price:locked.price, locked:true, available:true };
      totalCost += (locked.price||0)*item.quantity; perStoreTotal[locked.storeId] = (perStoreTotal[locked.storeId]||0)+(locked.price||0)*item.quantity;
      continue;
    }
    const best = cheapestWithin(candidates, chosenStoreSet.size?chosenStoreSet:activeIds);
    if(!best || best.price==null){
      assignments[item.id] = { storeId:candidates[0]?.storeId||item.preferredStoreId||null, price:null, locked:false, available:false };
      unavailableCount++;
      continue;
    }
    assignments[item.id] = { storeId:best.storeId, price:best.price, locked:false, available:true };
    totalCost += best.price*item.quantity; perStoreTotal[best.storeId] = (perStoreTotal[best.storeId]||0)+best.price*item.quantity;
  }
  return { assignments, perStoreTotal, totalCost, unavailableCount, storesUsed:Object.keys(perStoreTotal).length };
}
// "Billigast totalt (N butiker) vs. endast bästa enskilda butik" -- powers
// the "besök N butiker och spara X kr" / "handla allt på Y" messaging.
function compareSingleVsMulti(){
  const priceIndex = buildProductPriceIndex();
  const activeIds = activeListStoreIds();
  if(!activeIds.size) return null;
  const itemCands = listItems.map(item=>({ item, candidates:candidatesForItem(item, priceIndex) }));
  const multi = totalCostForStoreSet(itemCands, activeIds);
  let bestSingle = null;
  for(const sid of activeIds){
    const r = totalCostForStoreSet(itemCands, new Set([sid]));
    if(!bestSingle || r.unavailable<bestSingle.r.unavailable || (r.unavailable===bestSingle.r.unavailable && r.total<bestSingle.r.total)) bestSingle = { storeId:sid, r };
  }
  if(!bestSingle) return null;
  const storesUsedMulti = Object.keys(multi.perStore).length;
  return {
    multiTotal:multi.total, multiStores:storesUsedMulti, multiUnavailable:multi.unavailable,
    singleTotal:bestSingle.r.total, singleStoreId:bestSingle.storeId, singleUnavailable:bestSingle.r.unavailable,
    savings: bestSingle.r.total - multi.total,
  };
}

// National, lightweight (no deals/links attached) -- used for postnummer/ort
// search, cross-city follow bookkeeping, and anything else that needs to
// find/name a store regardless of which city's deal data is currently
// loaded. ALL_STORES/ALL_DEALS below stay scoped to the current CITY (plus
// any followed out-of-city stores) so the actual heavy payload -- deals,
// product_store_links -- never balloons to "every store in Sweden" just
// because the fleet keeps growing. See loadStoreDirectory()/loadCityData().
let STORE_DIRECTORY = [];

// table computed server-side from price_observations history (see migration
// add_product_price_stats) -- "is this deal's current price at or near the
// lowest we've ever recorded for this product" needs the FULL history, not
// just whatever's in the currently-scoped `deals`, so this loads in full
// exactly like STORE_DIRECTORY does.

    lat:r.lat!=null?Number(r.lat):null, lng:r.lng!=null?Number(r.lng):null, areaId:r.area_id };

function saveFollowed(){ localStorage.setItem('vf_followed_stores', JSON.stringify(Array.from(followedStoreIds))); }
function recomputeScope(){
  // A follow persists in localStorage across sessions/devices, and it wins
  // the STORES computation below unconditionally. If the user's city has
  // since diverged from where a followed store lives -- via an explicit
  // switchCity(), OR just because the page loaded straight into a
  // localStorage-persisted city from a PRIOR session while an old follow
  // from a different city was still sitting in vf_followed_stores -- that
  // stale follow silently and permanently overrides the current city's
  // whole view, with zero visible explanation beyond a small "Rensa valda
  // butiker" button buried in the Butiker tab. Self-heal HERE (every time
  // scope is recomputed, not only inside switchCity()) so it's fixed
  // regardless of how the mismatch arose. Uses STORE_DIRECTORY (national,
  // always fully loaded independent of which city's deal data is currently
  // scoped) rather than ALL_STORES -- ALL_STORES only holds the current
  // city's + followed stores' data now, so it can't reliably answer "is
  // this followed store even IN a different city" the way the always-
  // complete directory can. Guarded on AREAS/STORE_DIRECTORY actually being
  // loaded, so an early call before the catalog has landed can't wipe a
  // legitimate follow just because there's nothing to check it against yet.
  if(followedStoreIds.size && AREAS.length && STORE_DIRECTORY.length){
    const areaCity = new Map(AREAS.map(a=>[a.id, a.city_id]));
    const inCity = new Set(STORE_DIRECTORY.filter(s=>followedStoreIds.has(s.id) && areaCity.get(s.areaId)===currentCityId).map(s=>s.id));
    if(inCity.size !== followedStoreIds.size){ followedStoreIds = inCity; saveFollowed(); }
  }
  if(followedStoreIds.size){
    STORES = ALL_STORES.filter(s=>followedStoreIds.has(s.id));
  } else if(currentAreaId){
    STORES = ALL_STORES.filter(s=>s.areaId===currentAreaId);
  } else STORES = [];
  const ids = new Set(STORES.map(s=>s.id));
  deals = ALL_DEALS.filter(d=>ids.has(d.store));
  annotateCheaperElsewhere(deals);
  offersVisibleCount = OFFERS_PAGE_SIZE;
}
// For each deal, checks whether the same canonical product (via product_store_links,
// built by match-products) is cheaper at another store within the current scope.
// Only compares within scope (followed stores / current area) -- a cheaper price
// at a store the user doesn't shop at isn't actionable. Requires >0.5kr difference
// to filter out rounding noise between otherwise-identical prices.
function annotateCheaperElsewhere(scopedDeals){
  const byProduct = new Map();
  for(const d of scopedDeals){
    const pid = LINK_BY_KEY.get(`${d.store}::${d.product}`);
    d.cheaperElsewhere = null;
    if(!pid) continue;
    if(!byProduct.has(pid)) byProduct.set(pid, []);
    byProduct.get(pid).push(d);
  }
  for(const d of scopedDeals){
    const pid = LINK_BY_KEY.get(`${d.store}::${d.product}`);
    if(!pid) continue;
    const group = byProduct.get(pid);
    let best = null;
    for(const other of group){
      if(other.store===d.store) continue;
      if(!best || other.price < best.price) best = other;
    }
    if(best && best.price < d.price - 0.5){
      d.cheaperElsewhere = { storeName: storeById(best.store).name, price: best.price, unit: best.unit };
    }
  }
}

// The scraper occasionally writes the exact same deal twice (same store,
// product, detail, price -- verified against the live table: 182 such
// groups, 364 rows, 1.3% of all deals nationally). Rendered as-is that's a
// literal duplicate card in the grid for no reason. fetchAllDeals already
// orders by scraped_at.desc, so the first occurrence of a key is the
// freshest -- keep that one, drop the rest. Applied once here rather than
// at every ALL_DEALS assignment site so new callers get it for free.
function dedupeDeals(dealsArr){
  const seen = new Set();
  const out = [];
  for(const d of dealsArr){
    const key = `${d.store}|${d.product}|${d.detail}|${d.price}`;
    if(seen.has(key)) continue;
    seen.add(key);
    out.push(d);
  }
  return out;
}

// A deal counts as "historiskt lågt pris" only when we've actually SEEN the
// price move for this product (max > min -- otherwise every stable-priced
// item would trivially qualify as "at its all-time low" the moment it's
// scraped even once, which isn't a real signal). 2% slack on top of the
// observed floor absorbs scraper rounding, not genuine price differences.
function isHistoricLow(deal){
  const pid = LINK_BY_KEY.get(`${deal.store}::${deal.product}`);
  if(!pid) return false;
  const stats = PRICE_STATS_BY_PRODUCT.get(pid);
  if(!stats || !(stats.max > stats.min)) return false;
  return deal.price <= stats.min * 1.02;
}
// Most chains only put brand/image on a minority of their own deals -- if
// match-products has already linked this deal's raw text to a canonical
// product that SOME other chain supplied brand/image for, borrow it here
// rather than leaving the card blank.
function fillSharedBrandImageOrigin(dealRows, linkByKey, productRows){
  const productById = new Map(productRows.map(p=>[p.id, p]));
  for(const d of dealRows){
    const pid = linkByKey.get(`${d.store}::${d.product}`);
    if(!pid) continue;
    const p = productById.get(pid);
    if(!p) continue;
    if(!d.imageUrl && p.image_url) d.imageUrl = p.image_url;
    if(!d.brand && p.brand) d.brand = p.brand;
    if(!d.origin && p.origin) d.origin = p.origin;
  }
}

// the page requests -- the bottleneck moved from round-trips to sheer
// payload size. Fix: fetch only what the user is about to actually SEE
// (their current area, or their followed stores if they have any -- same
// priority recomputeScope() itself uses) first and render that immediately,
// then keep loading the full national catalog in the background so
// switching city/area, following an out-of-area store, and cross-area

async function loadScopedFirst(){

// Niklas's postnummer-first-loading spec: "appen [ska] inte ladda alla
// butiker i ett län eller en större region till klienten". This used to
// fetch EVERY active store nationally (deals + product_store_links included)
// into the background regardless of which city the user was even in -- a
// user browsing Umeå was silently downloading all of Stockholm's ~400
// stores' deals too, and that payload only grows as the fleet expands.
// Rescoped to the user's CURRENT CITY (all its areas) plus any followed
// stores outside it -- still enough to make area-switching within a city
// instant and cross-city follows work, but a Stockholm-sized city's data is
// never downloaded by someone who only cares about Umeå or Östersund.
// STORE_DIRECTORY (loadStoreDirectory) stays genuinely national, but it's
// lightweight -- no deals/links, just enough to search/name/map a store.
async function loadCityDataInBackground(){
  try{
    const areaIdsInCity = AREAS.filter(a=>a.city_id===currentCityId).map(a=>a.id);
    const filters = [];
    if(areaIdsInCity.length) filters.push(`area_id.in.(${areaIdsInCity.join(',')})`);
    if(followedStoreIds.size) filters.push(`id.in.(${Array.from(followedStoreIds).join(',')})`);
    if(!filters.length) return;
    const rows = await supa.selectRaw(`stores?select=${STORE_COLS}&active=eq.true&or=(${filters.join(',')})&order=name.asc`);
    const cityStores = Array.isArray(rows) ? rows.map(mapStoreRow) : [];
    const cityIds = cityStores.map(s=>s.id);
    let cityDeals = [], linkByKey = new Map();
    if(cityIds.length){
      const todayStr = new Date().toISOString().slice(0,10);
      const [dealRows, linkRows, productRows] = await Promise.all([
        supa.fetchAllDeals(cityIds.join(','), todayStr),
        supa.fetchAllProductLinks(cityIds.join(',')),
        supa.fetchAllProducts(),
      ]);
      cityDeals = dedupeDeals(dealRows.map(mapDealRow));
      linkByKey = new Map(linkRows.map(l=>[`${l.store_id}::${l.raw_product_text}`, l.product_id]));
      fillSharedBrandImageOrigin(cityDeals, linkByKey, productRows);
    }
    ALL_STORES = cityStores; ALL_DEALS = cityDeals; LINK_BY_KEY = linkByKey;

  }catch(e){ /* first-paint data is already showing; the next app open/switch retries */ }
}

function getWeekInfo() {
  const now = new Date();
  const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const ftDay = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - ftDay + 3);
  const week = 1 + Math.round((d - firstThursday) / (7 * 24 * 3600 * 1000));
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  const fmt = dt => dt.toLocaleDateString('sv-SE', { day: 'numeric', month: 'short' });
  return { week, range: `${fmt(monday)}–${fmt(sunday)}` };
}

function normalize(s){ return (s||'').toLowerCase().replace(/[åä]/g,'a').replace(/ö/g,'o').replace(/[-_,.]/g,' ').trim(); }
// A term found in the product's own name is real signal ("Coca Cola" ->
// product "Coca-Cola Zero 1,5L"). A term found only inside `detail` is much
// weaker: detail often lists many flavor/variant names in one
// comma-separated string (a Knorr noodle snack pot's detail can read
// "...Bolognese, ...Nötkött, ...Carbonara..."), so a search for "nötkött"
// matching there doesn't mean the PRODUCT is beef -- it means beef is one of
// a dozen flavor options on an unrelated product. d.matchedInProduct tags
// which kind of hit this was so callers can rank/label accordingly instead
// of treating both as equally trustworthy (found the hard way: a raw
// discount-% sort put exactly that noodle pot above real beef deals).
// Short Swedish words can accidentally collide with a longer, completely
// unrelated word that happens to contain them as a substring -- verified
// against real deals data, not guessed: "läsk" (soda) sits right inside
// "fläsk" (pork); "ost" (cheese) sits inside "bröst" (breast, as in every
// kycklingbröst/kalkonbröst deal), "rost"/"rostbiff"/"rostade", and
// "Frosties" (cereal).
//
// This second batch (lok/glas/cola) came from a systematic sweep, not more
// ad-hoc guessing: dumped every product/detail/brand string in the live
// `deals` table (27,377 rows), tokenized and normalized them exactly like
// this file's own normalize(), then checked every short (3-7 char) token
// against every longer token that contains it as a substring -- 1,146
// candidate pairs, most of them legitimate Swedish compounds (kyckling ->
// kycklingfilé) and correctly left alone. Confirmed real collisions:
// "lök" (onion) sits inside "Loka" (the water brand), "glas" (a drinking
// glass) sits inside "glass" (ice cream, so searching for tableware
// drowns in desserts), and "cola" sits inside "Ruccola"/"rucola" (arugula)
// and "chocolate".
//
// Strip the colliding longer word out of the haystack before substring-
// matching the short one, so a genuine standalone mention of the short
// word elsewhere in the same text still matches while the accidental
// collision doesn't. Extend this table as new collisions turn up in
// practice -- same maintenance model as KEYWORD_EXCLUDES in
// generate-weekly-recipes (also normalize()-key, not the raw word, per
// that function's own hard-won lesson about å/ä/ö in table keys).
const SEARCH_FALSE_FRIENDS = {
  'lask': ['flask'],         // läsk (soda) vs fläsk (pork)
  // ost (cheese) vs bröst/rost family. NOT just 'rost' -- that would also
  // strip the "ost" out of legitimate compounds like "Hamburgerost" (which
  // ends in ...ge-ROST), so this lists the specific colliding words instead
  // of their shared 4-letter tail.
  'ost': ['frost', 'rostbiff', 'rostade', 'rostat', 'ugnsrostad', 'mellanrost', 'morkrost', 'brost'],
  'lok': ['loka'],                                    // lök (onion) vs Loka (water brand)
  'glas': ['glass'],                                  // glas (drinking glass) vs glass (ice cream) -- covers glassbåt/glasspinne/etc too, they all contain "glass"
  'cola': ['ruccola', 'rucola', 'chocolate', 'chocolat'], // cola (soda) vs Ruccola/rucola (arugula) and chocolate
};
function stripFalseFriends(text, word){
  const friends = SEARCH_FALSE_FRIENDS[word];
  if(!friends) return text;
  let t = text;
  for(const f of friends) t = t.split(f).join(' ');
  return t;
}
function matchDealsForTerm(term, dealsArr){
  const n = normalize(term);
  const words = n.split(' ').filter(Boolean);
  return (dealsArr || ALL_DEALS).filter(d => {
    const dp = normalize(d.product), dd = normalize(d.detail||''), db = normalize(d.brand||'');
    return words.every(w => stripFalseFriends(dp,w).includes(w) || stripFalseFriends(dd,w).includes(w) || stripFalseFriends(db,w).includes(w));
  }).map(d => {
    // Brand is a real identity attribute (shown as its own label on every
    // card), not an incidental mention -- "Oatly" should match products
    // whose name is just "Ikaffe" with brand "Oatly" set separately, and
    // count as a strong match exactly like a product-name hit, not get
    // lumped in with weak detail-only variant-list hits.
    const dp2 = normalize(d.product), db2 = normalize(d.brand||'');
    d.matchedInProduct = words.every(w => stripFalseFriends(dp2,w).includes(w) || stripFalseFriends(db2,w).includes(w));
    return d;
  }).sort((a,b) => {
    if(a.matchedInProduct !== b.matchedInProduct) return a.matchedInProduct ? -1 : 1;
    return ((b.origPrice-b.price)/(b.origPrice||1)) - ((a.origPrice-a.price)/(a.origPrice||1));
  });
}

function scaleAmount(amount, unit, factor){
  if(!amount || factor===1) return amount;
  let n;
  const s = String(amount);
  if(s.includes('/')){ const [a,b]=s.split('/'); n = parseFloat(a)/parseFloat(b); } else { n = parseFloat(s.replace(',','.')); }
  if(isNaN(n)) return amount;
  const scaled = n * factor;
  const discrete = ['st','förp','paket','burk','skivor','kvistar'];
  if(discrete.includes(unit)) return String(Math.max(1, Math.ceil(scaled)));
  if(scaled >= 10) return String(Math.round(scaled/5)*5);
  if(scaled >= 1) return (Math.round(scaled*2)/2).toString();
  return (Math.round(scaled*4)/4).toString();
}

async function toggleItem(id){

async function submitOffer(){

function detectMember(o){
  const d = (o.detail||'').toLowerCase(), p = (o.product||'').toLowerCase();
  if(/med lidl plus|lidl plus kupong|lidl\+/i.test(d+p)) return {label:'Kräver Lidl Plus',color:'#1A4F8A',bg:'#DEEAF8'};
  if(/stammis|ica stammis/i.test(d+p))                    return {label:'Kräver ICA Stammis',color:'#B80000',bg:'#FADEDE'};
  if(/matv.rlden vip|vip-pris/i.test(d+p))                return {label:'Kräver Matvärlden VIP',color:'#5A2D8A',bg:'#EDE3F8'};
  if(/hemköp plus|hemkop plus/i.test(d+p))                return {label:'Kräver Hemköp Plus',color:'#8A1A5A',bg:'#F8DEEE'};
  if(/coop members/i.test(d+p))                           return {label:'Kräver Coop Membership',color:'#005B8E',bg:'#D8EEF8'};
  if(/willys plus|willys\+/i.test(d+p))                  return {label:'Kräver Willys Plus',color:'#8A1A1A',bg:'#F8DEDE'};
  if(o.member)                                             return {label:'Kräver medlemskap',color:'#4A4A4A',bg:'#EBEBEB'};
  return null;
}

}
function offerCard(o){
  const st = storeById(o.store);
  const save = (o.origPrice||0) - o.price;
  const hasDisc = save > 0.001;
  const pct = hasDisc && o.origPrice ? Math.round(save/o.origPrice*100) : 0;
  const added = inList(o.id);
  const historicLow = isHistoricLow(o);
  const member = detectMember(o);
  const memberBadge = member ? `<div style="display:inline-flex;align-items:center;gap:5px;background:${member.bg};border-radius:9px;padding:5px 10px;margin-top:7px;"><span style="font-size:13px;">🏷️</span><span style="font-size:11.5px;font-weight:800;color:${member.color};">${esc(member.label)}</span></div>` : '';
  let details = o.detail||'';
  if(o.validTo){
    const WD=['sön','mån','tis','ons','tor','fre','lör'];
    const vt=new Date(o.validTo+'T00:00:00'); const today=new Date(); today.setHours(0,0,0,0);
    const daysLeft=Math.round((vt-today)/86400000);
    if(daysLeft<=2){ details=(details?details+' · ':'')+(daysLeft<=0?'⏰ Sista dagen idag':`⏰ Gäller t.o.m. ${WD[vt.getDay()]}`); }
  }

  // Multi-buy deals ("3 för 25 kr") show promo_label as the headline instead

  // into a "kr/st" figure and show only that, discarding the multi-buy deal
  // itself (Niklas: "visa erbjudandet som det är"). o.price is still the
  // correct per-item figure internally (sorting, cheaper-elsewhere), so it's
  // shown small as a "≈" hint when there's no separate jämförpris already.
  const jmfRow = showJmf ? `<div style="font-size:11px;color:#8A7E6E;margin-top:2px;">Jämförpris ${kr(o.jamforpris)} ${esc(o.jamforenhet||'')}</div>`
    : (o.promoLabel ? `<div style="font-size:11px;color:#8A7E6E;margin-top:2px;">≈ ${kr(o.price)}${unitSuffix(o.unit)}</div>` : '');
  const cheaperRow = o.cheaperElsewhere ? `<div style="display:inline-flex;align-items:center;gap:5px;background:#EAF1E3;border-radius:9px;padding:5px 10px;margin-top:7px;"><span style="font-size:12px;">💡</span><span style="font-size:11.5px;font-weight:700;color:#3E6632;">Billigare hos ${esc(o.cheaperElsewhere.storeName)}: ${kr(o.cheaperElsewhere.price)}${unitSuffix(o.cheaperElsewhere.unit)}</span></div>` : '';
  const priceMain = o.promoLabel
    ? `<span style="font-family:${DISP};font-weight:800;font-size:21px;color:#E0552E;">${esc(o.promoLabel)}</span>`
    : `<span style="font-family:${DISP};font-weight:800;font-size:25px;color:#E0552E;">${kr(o.price)}<span style="font-size:14px;font-weight:700;">${unitSuffix(o.unit)}</span></span>`;
  const priceRow = `<div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:auto;">
      ${priceMain}
      ${hasDisc?`<span style="font-size:13px;color:#B6A893;text-decoration:line-through;">${kr(o.origPrice)}${unitSuffix(o.unit)}</span>
      <span style="margin-left:auto;font-size:11.5px;font-weight:700;color:#3E6632;background:#EAF1E3;padding:5px 9px;border-radius:9px;">Spara ${kr(save)}${unitSuffix(o.unit)}</span>`:''}
    </div>
    ${jmfRow}
  </div>`;
  const badge = hasDisc?`<div style="background:#FBEAE2;color:#C2431F;font-weight:800;font-size:13px;padding:5px 9px;border-radius:10px;flex:none;font-family:${DISP};">-${pct}%</div>`:'';
  // Cards sit in a CSS grid, which stretches every card in a row to match
  // the tallest one -- so the price+button footer needs to move as ONE unit
  // to the bottom, not just the button. Otherwise a card with a short
  // description puts its price directly under the name while a card with a
  // long flavor list (e.g. Bryggkaffe's variant names) pushes its price much
  // lower, so prices/jämförpris/button all land at different heights across
  // a row (Niklas: "sätt priserna och infon på erbjudandena på samma
  // ställen ... enhetligt"). Wrapping price+button together with a single
  // margin-top:auto on that wrapper keeps them glued to each other AND
  // pinned to the same bottom edge on every card.
  const addStyle = added
    ? `width:100%;padding:11px;border-radius:13px;font-weight:700;font-size:14px;font-family:${FAM};border:1px solid #CFE0C2;background:#EAF1E3;color:#3E6632;cursor:default;`
    : `width:100%;padding:11px;border-radius:13px;font-weight:700;font-size:14px;font-family:${FAM};border:none;background:#2A211A;color:#fff;cursor:pointer;`;
  const metaParts = [];

      ${dealImage(o,64)}

        ${brandRow}

        <div style="font-size:12.5px;color:#8A7E6E;margin-top:2px;">${esc(details)}</div>
        ${historicLow?`<div style="display:inline-flex;align-items:center;gap:5px;background:#FBEAE2;border-radius:9px;padding:5px 10px;margin-top:7px;"><span style="font-size:13px;">🔥</span><span style="font-size:11.5px;font-weight:800;color:#C2431F;">Lägsta priset vi sett</span></div>`:''}
        ${memberBadge}
        ${cheaperRow}
        ${o.matchNote?`<div style="font-size:11px;color:#A67C3D;margin-top:6px;">🔎 ${esc(o.matchNote)}</div>`:''}
      </div>
      ${badge}
    </div>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:12px;">
      ${priceRow}
      <button ${added?'':`onclick="addOffer(${o.id})"`} style="${addStyle}">${added?'✓ Tillagd på listan':'+ Lägg till på lista'}</button>
    </div>
  </div>`;
}
function viewOffers(){
  if(catalogLoading) return `<div style="text-align:center;padding:60px 20px;color:#8A7E6E;">Hämtar veckans erbjudanden…</div>`;
  if(catalogError) return `<div style="text-align:center;padding:60px 20px;color:#8A7E6E;">${esc(catalogError)}</div>`;
  if(productSearchResults){
    const clearBtn = `<button onclick="clearProductSearch()" style="padding:9px 15px;border-radius:12px;border:1px solid #E3D8C6;background:#fff;color:#6A5E50;font-weight:700;font-size:13px;font-family:${FAM};cursor:pointer;margin-bottom:14px;">✕ Rensa sökning</button>`;
    return clearBtn + productSearchResultsView();
  }
  const totalSave = deals.reduce((a,o)=>a+(isPerUnitDiscount(o.unit)?Math.max(0,(o.origPrice||0)-o.price):0),0);
  const present = CAT_ORDER.filter(c=>deals.some(o=>o.category===c));
  const chipDefs = ['Alla'].concat(present);
  const chips = chipDefs.map(c=>{ const a=cat===c;
    return `<button onclick="setCat('${c.replace(/'/g,"\\'")}')" style="padding:9px 15px;border-radius:12px;border:${a?'none':'1px solid #EFE6D8'};background:${a?'#E0552E':'#fff'};color:${a?'#fff':'#6A5E50'};font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer;font-family:${FAM};flex:none;">${esc(c)}</button>`; }).join('');
  const byCat = cat==='Alla'? deals : deals.filter(o=>o.category===cat);
  const visible = showHistoricLowOnly ? byCat.filter(isHistoricLow) : byCat;
  const shown = visible.slice(0, offersVisibleCount);
  const emptyMsg = showHistoricLowOnly ? 'Inga erbjudanden till lägsta pris just nu i denna kategori.' : 'Inga erbjudanden i denna kategori.';

// ── Butiker nära dig (postnummer/ort/geolocation sök) ────────
// North-star feature: search any Swedish postnummer or ort and get the
// nearest stores back, sorted by distance, regardless of the user's
// currently selected city/area -- distinct from the existing area
// dropdown, which only ever lists ONE preset area at a time. Geocoding via
// Nominatim (OpenStreetMap) since the map already depends on OSM tiles, no
// new API key needed; distance uses the same flat-earth approximation the
// backend already uses for area-assignment (accurate enough at this scale,
// consistent with the rest of the codebase).
function isSwedishPostalCode(s){ return /^\d{3}\s?\d{2}$/.test(s.trim()); }
function distanceKm(lat1, lng1, lat2, lng2){
  const avgLat = (lat1+lat2)/2;
  const dlat = (lat2-lat1)*111.0;
  const dlng = (lng2-lng1)*111.0*Math.cos(avgLat*Math.PI/180);
  return Math.sqrt(dlat*dlat + dlng*dlng);
}
async function geocodeLocation(query){
  const q = query.trim();
  if(!q) return null;
  const params = isSwedishPostalCode(q)
    ? `postalcode=${encodeURIComponent(q)}&country=Sweden`
    : `q=${encodeURIComponent(q + ', Sverige')}`;
  const res = await fetch(`https://nominatim.openstreetmap.org/search?${params}&format=jsonv2&limit=1`, { headers: { 'Accept-Language': 'sv' } });
  if(!res.ok) return null;
  const rows = await res.json();
  if(!Array.isArray(rows) || !rows.length) return null;
  return { lat: Number(rows[0].lat), lng: Number(rows[0].lon), label: rows[0].display_name || q };
}
function computeStoreSearchResults(){
  if(!storeSearchOrigin) return;
  const { lat, lng } = storeSearchOrigin;
  // Nationwide by design (STORE_DIRECTORY, not ALL_STORES) -- the whole
  // point of postnummer/ort search is finding stores regardless of which
  // city's deal data happens to be loaded right now.
  storeSearchResults = STORE_DIRECTORY
    .filter(st=>st.lat!=null && st.lng!=null)
    .map(st=>({ st, dist: distanceKm(lat, lng, st.lat, st.lng) }))
    .sort((a,b)=>a.dist-b.dist)
    .slice(0, 24);
}
async function searchStoresNear(){
  const el = document.getElementById('store_search_input');

  if(!storeSearchInput){ storeSearchError = 'Skriv ett postnummer eller en ort.'; render(); return; }
  storeSearchLoading = true; storeSearchError = null; render();
  let origin = null;
  try{ origin = await geocodeLocation(storeSearchInput); }catch(e){ origin = null; }
  storeSearchLoading = false;
  if(!origin){ storeSearchError = `Hittade inte "${storeSearchInput}". Prova ett postnummer (t.ex. 184 40) eller en ort.`; storeSearchResults = null; render(); return; }
  storeSearchOrigin = origin;
  computeStoreSearchResults();
  render();
  track('store_search_performed', { query_type: isSwedishPostalCode(storeSearchInput)?'postnummer':'ort', result_count: (storeSearchResults||[]).length }, {}, { source:'user_action' });
}
function useMyLocation(){

    { timeout: 10000 }

function storeCardData(st, items){

// One pass over ALL_DEALS instead of one ALL_DEALS.filter() PER store --

function dealsByStore(){
  const m = new Map();

    if(!m.has(d.store)) m.set(d.store, []);
    m.get(d.store).push(d);

}

function clearFollowed(){ followedStoreIds.clear(); saveFollowed(); recomputeScope(); render(); }
function addStoreMarker(st){
  if(st.lat==null || st.lng==null) return null;
  const followed = followedStoreIds.has(st.id);
  const icon = L.divIcon({className:'', html:`<div class="vf-pin" style="background:${followed?'#E0552E':st.color};"><span>${followed?'✓':(st.logo||'🛒')}</span></div>`, iconSize:[30,30], iconAnchor:[15,30]});
  const marker = L.marker([st.lat, st.lng], {icon}).addTo(vfMap);
  marker.bindPopup(`<b>${esc(st.name)}</b><br>${followed?'Följs — klicka för att sluta följa':'Klicka på nålen för att följa'}`);
  marker.on('click', ()=>toggleFollow(st.id));
  vfMapMarkers[st.id] = marker;
  return [st.lat, st.lng];
}
function renderStoreMap(){
  const el = document.getElementById('vf-map');
  if(!el || typeof L === 'undefined') return;
  if(vfMapResizeObserver){ try{ vfMapResizeObserver.disconnect(); }catch(e){} vfMapResizeObserver = null; }
  if(vfMap){ try{ vfMap.remove(); }catch(e){} vfMap = null; }
  vfMap = L.map('vf-map', {scrollWheelZoom:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(vfMap);
  vfMapMarkers = {};
  const pts = [];
  if(storeSearchResults){
    if(storeSearchOrigin){
      pts.push([storeSearchOrigin.lat, storeSearchOrigin.lng]);
      const originIcon = L.divIcon({className:'', html:'<div class="vf-pin" style="background:#2A211A;"><span>📍</span></div>', iconSize:[30,30], iconAnchor:[15,30]});
      L.marker([storeSearchOrigin.lat, storeSearchOrigin.lng], {icon: originIcon}).addTo(vfMap).bindPopup('Din sökning');
    }
    storeSearchResults.forEach(({st})=>{ const p = addStoreMarker(st); if(p) pts.push(p); });
  } else {
    if(!ALL_STORES.length) return;
    const areaCity = new Map(AREAS.map(a=>[a.id, a.city_id]));
    const mapStores = ALL_STORES.filter(st=> areaCity.get(st.areaId)===currentCityId || followedStoreIds.has(st.id));
    mapStores.forEach(st=>{ const p = addStoreMarker(st); if(p) pts.push(p); });
  }
  if(pts.length) vfMap.fitBounds(pts, {padding:[24,24], maxZoom:14});
  setTimeout(()=>vfMap && vfMap.invalidateSize(), 80);
  // A fixed 80ms guess at "the container has its final layout by now" can be
  // wrong (slow device, web-font reflow, the innerHTML swap still settling),
  // and a stale Leaflet tile-grid size after that is exactly what makes the
  // map visually spill over/overlap whatever sits below it. A ResizeObserver
  // catches every REAL size change (not just the first guessed one) for as
  // long as this map instance is alive, so it self-corrects regardless of
  // timing instead of hoping one delayed check was late enough.
  if(typeof ResizeObserver !== 'undefined'){
    vfMapResizeObserver = new ResizeObserver(()=>{ if(vfMap) vfMap.invalidateSize(); });
    vfMapResizeObserver.observe(el);
  }

// ── Sök vara (produkt/märke + plats → vilken butik har den på erbjudande) ─

// zero network round trip) -- fast, and matches what the rest of the app
// already scopes to. Only when the user explicitly picks a different place

let productSearchTerm = '', productSearchLocationInput = '', productSearchOrigin = null,

const PRODUCT_SEARCH_STORE_COUNT = 30; // same nearest-N radius as "Butiker nära dig"

function headerProductSearch(){

// Fetches deals for a location-derived store set and matches -- used only

async function runProductSearch(origin){

      .filter(st=>st.lat!=null && st.lng!=null)
      .map(st=>({ st, dist: distanceKm(origin.lat, origin.lng, st.lat, st.lng) }))
      .sort((a,b)=>a.dist-b.dist)

    const distByStoreId = new Map(nearby.map(n=>[n.st.id, n.dist]));
    const idsCsv = nearby.map(n=>n.st.id).join(',');
    const todayStr = new Date().toISOString().slice(0,10);
    const rawRows = idsCsv ? await supa.fetchAllDeals(idsCsv, todayStr) : [];
    const nearbyDeals = dedupeDeals(rawRows.map(mapDealRow));
    productSearchResults = matchDealsForTerm(productSearchTerm, nearbyDeals)
      .map(d=>({ ...d, dist: distByStoreId.get(d.store),
        matchNote: d.matchedInProduct ? null : `Matchar bland flera varianter: "${productSearchTerm}"` }))
      // Real product-name/brand matches first (never bury an actual match
      // behind a detail-only one just because the latter happens to be
      // cheaper), then price ascending within each group.
      .sort((a,b)=> (b.matchedInProduct?1:0)-(a.matchedInProduct?1:0) || a.price-b.price);
    productSearchLoading = false;
    render();
    track('product_search_performed', { term: productSearchTerm, result_count: productSearchResults.length, store_count: nearby.length, scope: 'elsewhere' }, {}, { source:'user_action' });
  }catch(e){
    productSearchLoading = false; productSearchError = 'Något gick fel, försök igen.'; render();
  }
}

  productSearchTerm=''; productSearchResults=null; productSearchError=null; render();
}

  const notFound = searchResults.filter(r=>r.hits.length===0);

  // Bygg en butikskarta: vilken butik täcker flest söktermer?
  const storeScore = {};
  found.forEach(r => {
    const best = r.hits[0]; // bäst rabatt för denna term
    storeScore[best.store] = (storeScore[best.store]||0) + 1;
  });
  const bestStore = Object.entries(storeScore).sort((a,b)=>b[1]-a[1])[0];

  const foundRows = found.map(r => {
    const best = r.hits[0];
    const st = storeById(best.store);
    const disc = best.origPrice > best.price ? `<span style="color:#E0552E;font-weight:800;font-size:11px;margin-left:6px;">-${Math.round((1-best.price/best.origPrice)*100)}%</span>` : '';
    const already = inList(best.id);
    const btn = already
      ? `<span style="font-size:11px;color:#4F7A3F;font-weight:700;">✓ Tillagd</span>`
      : `<button onclick="addSearchHit(${best.id})" style="padding:5px 12px;border:none;border-radius:9px;background:#2A211A;color:#fff;font-weight:700;font-size:12px;font-family:${FAM};cursor:pointer;">+ Lägg till</button>`;

      </div>
      ${btn}
    </div>`;
  }).join('');

  const notFoundRows = notFound.length ? `<div style="padding:10px 14px;font-size:12.5px;color:#B6A893;">
    Inga fynd: ${notFound.map(r=>`<b>${esc(r.term)}</b>`).join(', ')}
  </div>` : '';

  const tipRow = bestStore && storeScore[bestStore[0]] > 1
    ? `<div style="margin-top:10px;background:#EAF1E3;border-radius:12px;padding:10px 14px;font-size:12.5px;color:#3E6632;font-weight:700;">
        💡 ${esc(storeById(bestStore[0]).name)} täcker ${bestStore[1]} av dina sökta varor
      </div>` : '';

  return `<div style="background:#fff;border:1px solid #EFE6D8;border-radius:18px;overflow:hidden;margin-bottom:4px;box-shadow:0 2px 10px rgba(42,33,26,.04);">
    <div style="padding:12px 14px 8px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#8A7E6E;">
      ${found.length} fynd hittade • ${notFound.length} saknas denna vecka
    </div>
    ${foundRows}${notFoundRows}
  </div>${tipRow}`;
}

function buildWeeklyMenu(){
  const cats = ['family','protein','healthy','vegetarian','family'];
  const used = new Set(); const menu = [];
  for(const cat of cats){
    const pool = RECIPES.filter(r=>r.category===cat && !used.has(r.id));
    if(pool.length){ const pick = pool[0]; used.add(pick.id); menu.push(pick); }
  }
  weeklyMenu = menu; render();
}
function swapMenuRecipe(idx){
  if(!weeklyMenu) return;
  const cur = weeklyMenu[idx];
  const used = new Set(weeklyMenu.map(r=>r.id));
  const pool = RECIPES.filter(r=>r.category===cur.category && !used.has(r.id));
  if(pool.length){ weeklyMenu[idx] = pool[0]; render(); }

}
async function addMenuToShoppingList(){
  if(!session){ showToast('🔐 Logga in för att lägga till på listan'); tab='lista'; render(); return; }
  if(!household || !currentListId){ showToast('⚠️ Kunde inte ladda din lista'); tab='lista'; render(); return; }
  if(!weeklyMenu || !weeklyMenu.length) return;
  // Merge by exact ingredient NAME text -- this is deliberately what keeps
  // genuinely different products from ever merging (vispgrädde vs.
  // matlagningsgrädde are different strings, so they never collide) while
  // still combining the same real ingredient across recipes (500g kyckling +
  // 700g kyckling -> one merged line).
  const merged = {};
  for(const r of weeklyMenu){
    for(const ing of (r.ingredients||[])){
      const key = (ing.name||'').toLowerCase();
      if(!key) continue;
      if(!merged[key]) merged[key] = { name: ing.name, parts: [], price: null, dealId: null, store: null };
      const scaledAmt = scaleAmount(ing.amount, ing.unit, householdSize/(r.servings||4));
      merged[key].parts.push(`${scaledAmt||''} ${ing.unit||''}`.trim());
      if(ing.fromDealId && merged[key].dealId==null){ merged[key].dealId = ing.fromDealId; merged[key].price = ing.price; merged[key].store = ing.store; }
    }
  }
  let addedCount = 0;
  for(const key in merged){
    const m = merged[key];
    if(inList(m.dealId) && m.dealId!=null) continue;
    if(!m.dealId && listItems.some(it=>it.product.toLowerCase()===key)) continue;
    const itemId = crypto.randomUUID();
    const detail = m.parts.filter(Boolean).join(' + ');
    if(m.store && !listStores.some(s=>s.storeId===m.store)) await addListStore(m.store);
    const item = { id:itemId, product:m.name, detail, category:'Skafferivaror', emoji:'🛒', quantity:1, unit:'st',
      dealId:m.dealId, preferredStoreId:m.store, recommendedStoreId:m.store, manualStoreOverride:null, estimatedPrice:m.price, checked:false, source:'recipe' };
    listItems.push(item); addedCount++;
    try{ await supa.insert('shopping_list_items', { id:itemId, list_id:currentListId, product:item.product, detail, category:'Skafferivaror', emoji:'🛒',
      quantity:1, unit:'st', deal_id:m.dealId, preferred_store_id:m.store, recommended_store_id:m.store, estimated_price:m.price, is_checked:false, source:'recipe', added_by:session.user.id }); }catch(e){}
  }
  markWrite(); tab='lista'; showToast(`✓ ${addedCount} varor tillagda från veckomenyn`); render();
}

    </div>
    ${dashboardFooter}
  </div>`;

  // "Mina mål" -- pause/resume/add without ever needing to re-onboard.
  // Language stays neutral/helpful throughout (no "du missade ditt mål"),
  // and archiving a goal never touches logged history.
  function goalRow(g){
    const label = g.label || GOAL_TYPE_LABELS[g.goalType] || g.goalType;
    const detail = [g.baseKcalGoal!=null?g.baseKcalGoal+' kcal':'', g.proteinGoalG!=null?g.proteinGoalG+'g protein':''].filter(Boolean).join(' · ');
    const isPaused = g.status==='paused';
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F3ECDF;">
      <div style="flex:1;min-width:0;">
        <div style="font-weight:700;font-size:14px;${isPaused?'color:#B6A893;':''}">${esc(label)}${g.priority==='secondary'?` <span style="font-weight:500;color:#B6A893;font-size:11.5px;">(sekundärt)</span>`:''}${isPaused?' <span style="font-weight:500;font-size:11.5px;">· pausat</span>':''}</div>
        ${detail?`<div style="font-size:12px;color:#8A7E6E;margin-top:1px;">${esc(detail)}</div>`:''}
      </div>
      ${isPaused
        ? `<button onclick="resumeGoal('${g.id}')" style="flex:none;padding:6px 12px;border:1px solid #EFE6D8;border-radius:9px;background:#fff;color:#3E6632;font-weight:700;font-size:12px;cursor:pointer;font-family:${FAM};">Återuppta</button>`
        : `<button onclick="pauseGoal('${g.id}')" style="flex:none;padding:6px 12px;border:1px solid #EFE6D8;border-radius:9px;background:#fff;color:#6A5E50;font-weight:700;font-size:12px;cursor:pointer;font-family:${FAM};">Pausa</button>`}
      <button onclick="archiveGoal('${g.id}')" title="Ta bort" style="flex:none;border:none;background:none;color:#B6A893;cursor:pointer;font-size:15px;">✕</button>
    </div>`;
  }
  const goalTypeOptions = Object.entries(GOAL_TYPE_LABELS).map(([v,l])=>`<option value="${v}" ${goalFormDraft.goalType===v?'selected':''}>${l}</option>`).join('');
  const goalForm = goalFormOpen ? `<div style="background:#FBF6EE;border:1px dashed #E0D5C2;border-radius:14px;padding:14px;margin-top:10px;">
      <label style="display:block;margin-bottom:10px;">${lbl('Typ av mål')}<select onchange="setGoalDraftField('goalType',this.value)" style="${inputStyle()}">${goalTypeOptions}</select></label>
      <div style="font-size:12px;color:#8A7E6E;margin-bottom:10px;">Kalori- och proteinmål är valfria — lämna tomt om du bara vill ha receptförslag utan att räkna kalorier.</div>
      <div style="display:flex;gap:10px;margin-bottom:10px;">
        <label style="flex:1;">${lbl('Kalorimål/dag (valfritt)')}<input id="newgoal_kcal" type="number" placeholder="t.ex. 2200" style="${inputStyle()}"></label>
        <label style="flex:1;">${lbl('Proteinmål g (valfritt)')}<input id="newgoal_protein" type="number" placeholder="t.ex. 120" style="${inputStyle()}"></label>
      </div>
      <label style="display:block;margin-bottom:12px;">${lbl('Strategi vid träning (om kalorimål anges)')}
        <select onchange="setGoalDraftField('calorieStrategy',this.value)" style="${inputStyle()}">
          <option value="fixed" ${goalFormDraft.calorieStrategy==='fixed'?'selected':''}>Fast kalorimål</option>
          <option value="partial" ${goalFormDraft.calorieStrategy==='partial'?'selected':''}>Delvis aktivitetsjustering</option>
          <option value="dynamic" ${goalFormDraft.calorieStrategy==='dynamic'?'selected':''}>Dynamiskt mål</option>
        </select>
      </label>
      <div style="display:flex;gap:10px;">
        <button onclick="closeGoalForm()" style="flex:none;padding:12px 16px;border:1px solid #E3D8C6;border-radius:12px;background:#fff;color:#6A5E50;font-weight:700;font-size:14px;font-family:${FAM};cursor:pointer;">Avbryt</button>
        <button onclick="saveNewGoal()" style="flex:1;padding:12px;border:none;border-radius:12px;background:#2A211A;color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:${FAM};">Lägg till mål</button>
      </div>
    </div>` : `<button onclick="openGoalForm()" style="width:100%;margin-top:10px;padding:12px;border:1px dashed #E0D5C2;border-radius:12px;background:transparent;color:#6A5E50;font-weight:700;font-size:13.5px;cursor:pointer;font-family:${FAM};">+ Lägg till mål</button>`;
  const activeGoals = memberGoals.filter(g=>g.status==='active'), pausedGoals = memberGoals.filter(g=>g.status==='paused');
  const goalsPanel = `<div style="background:#fff;border:1px solid #EFE6D8;border-radius:18px;padding:16px 18px;margin-bottom:14px;">
    <div style="font-weight:800;font-family:${DISP};font-size:15px;margin-bottom:4px;">🎯 Mina mål</div>
    <div style="font-size:12px;color:#8A7E6E;margin-bottom:8px;">Mål är förslag, inte regler — pausa eller ändra när som helst.</div>
    ${(activeGoals.length||pausedGoals.length) ? activeGoals.map(goalRow).join('')+pausedGoals.map(goalRow).join('') : `<div style="font-size:13px;color:#8A7E6E;padding:8px 0;">Inga mål ännu.</div>`}
    ${goalForm}
  </div>`;

  const activityForm = `<div style="background:#fff;border:1px solid #EFE6D8;border-radius:18px;padding:16px 18px;margin-bottom:14px;">
    <div style="font-weight:800;font-family:${DISP};font-size:15px;margin-bottom:4px;">🏃 Logga dagens aktivitet</div>
    <div style="font-size:12px;color:#8A7E6E;margin-bottom:12px;">Manuellt idag — samma fält kopplas automatiskt till Apple Health/Garmin/Health Connect den dagen en sådan integration finns.</div>
    <div style="display:flex;gap:10px;margin-bottom:10px;">
      <label style="flex:1;">${lbl('Steg')}<input id="act_steps" type="number" value="${todayActivity.steps||''}" style="${inputStyle()}"></label>
      <label style="flex:1;">${lbl('Aktiva kcal')}<input id="act_active_kcal" type="number" value="${todayActivity.activeCalories||''}" style="${inputStyle()}"></label>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:12px;">
      <label style="flex:1;">${lbl('Träningsminuter')}<input id="act_workout_min" type="number" value="${todayActivity.workoutMinutes||''}" style="${inputStyle()}"></label>
      <label style="flex:1;">${lbl('Vikt (kg, valfritt)')}<input id="act_weight" type="number" step="0.1" value="${todayActivity.weight||''}" style="${inputStyle()}"></label>
    </div>
    <button onclick="saveTodayActivity()" style="width:100%;padding:12px;border:none;border-radius:12px;background:#2A211A;color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:${FAM};">Spara aktivitet</button>
  </div>`;

  const foodRows = todayFoodLogs.map(f=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F3ECDF;">
      <div style="flex:1;font-size:13.5px;">${esc(f.description)}</div>
      <div style="font-size:12px;color:#8A7E6E;">${f.kcal} kcal${f.proteinG?' · '+Math.round(f.proteinG)+'g P':''}</div>
      <button onclick="removeFoodLog('${f.id}')" style="border:none;background:none;color:#B6A893;cursor:pointer;font-size:16px;">✕</button>
    </div>`).join('');
  const foodLog = `<div style="background:#fff;border:1px solid #EFE6D8;border-radius:18px;padding:16px 18px;margin-bottom:14px;">
    <div style="font-weight:800;font-family:${DISP};font-size:15px;margin-bottom:12px;">🍽️ Vad har ätits idag</div>
    ${foodRows || `<div style="font-size:13px;color:#8A7E6E;margin-bottom:10px;">Inget loggat än — lägg till manuellt, eller tryck "✓ Jag åt detta" på ett recept nedan.</div>`}
    <div style="display:flex;gap:8px;margin-top:${foodRows?'12px':'0'};">
      <input id="food_desc" placeholder="t.ex. Havregrynsgröt" style="${inputStyle()}flex:2;">
      <input id="food_kcal" type="number" placeholder="kcal" style="${inputStyle()}flex:1;">
      <input id="food_protein" type="number" placeholder="protein g" style="${inputStyle()}flex:1;">
    </div>
    <button onclick="addFoodLogManual()" style="width:100%;margin-top:8px;padding:12px;border:1px solid #EFE6D8;border-radius:12px;background:#fff;color:#2A211A;font-weight:700;font-size:14px;cursor:pointer;font-family:${FAM};">+ Lägg till</button>
  </div>`;

  // Rank existing (already deal-matched) weekly recipes by fit to what's
  // left today when there IS a kcal goal; otherwise just surface a plain
  // selection -- no kcal target means nothing to rank against, and forcing
  // a "passar ditt mål" framing on someone who never set one would be
  // exactly the kind of unearned precision this feature must avoid.
  const hasKcalTarget = remainingKcal!=null;
  const candidates = hasKcalTarget
    ? RECIPES.filter(r=>r.kcal!=null).map(r=>{
        const kcalDiff = Math.abs((r.kcal||0) - Math.max(0,remainingKcal));
        const overBudget = remainingKcal>0 && r.kcal > remainingKcal*1.15;
        const proteinFit = remainingProtein!=null && remainingProtein>0 ? Math.min(1,(Number(r.proteinG)||0)/remainingProtein) : 0;
        return { r, score:(overBudget?1000:0)+kcalDiff-proteinFit*80 };
      }).sort((a,b)=>a.score-b.score).slice(0,6).map(x=>x.r)
    : RECIPES.slice(0,6);
  const suggestRows = candidates.map(r=>`<div style="background:#fff;border:1px solid #EFE6D8;border-radius:16px;padding:14px 16px;margin-bottom:10px;">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
        <div style="font-family:${DISP};font-weight:800;font-size:15px;">${esc(r.title)}</div>
        <button onclick="logRecipeEaten('${r.id}')" style="flex:none;padding:7px 12px;border:none;border-radius:10px;background:#3E6632;color:#fff;font-weight:700;font-size:12px;cursor:pointer;font-family:${FAM};">✓ Jag åt detta</button>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
        ${r.kcal!=null?`<span style="font-size:11.5px;font-weight:700;color:#8A5A2B;background:#FBF0DE;padding:4px 9px;border-radius:8px;">${r.kcal} kcal</span>`:''}
        ${r.proteinG!=null?`<span style="font-size:11.5px;font-weight:700;color:#3E6632;background:#EAF1E3;padding:4px 9px;border-radius:8px;">P ${r.proteinG}g</span>`:''}
        ${r.estimatedTotalCost!=null?`<span style="font-size:11.5px;font-weight:700;color:#6A5E50;background:#F0E8DA;padding:4px 9px;border-radius:8px;">ca ${kr(r.estimatedTotalCost)}</span>`:''}
      </div>
    </div>`).join('');
  const suggestSection = `<div style="margin-bottom:6px;">
    <div style="font-weight:800;font-family:${DISP};font-size:16px;margin-bottom:10px;">${hasKcalTarget?'🍳 Middagar som passar ditt mål':'🍳 Middagsförslag'}</div>
    ${RECIPES.length===0 ? `<div style="text-align:center;padding:24px 20px;color:#8A7E6E;font-size:13.5px;">Inga recept genererade för ${esc(currentAreaName)} än.</div>` : (suggestRows || `<div style="text-align:center;padding:24px 20px;color:#8A7E6E;font-size:13.5px;">Inga recept matchar just nu.</div>`)}
  </div>`;

  return memberSwitcher + dashboard + goalsPanel + activityForm + foodLog + suggestSection;
}
function viewRecipes(){
  if(recipesLoadedForArea !== currentAreaId) loadRecipes();
  if(showWeeklyMenu) return viewWeeklyMenu();
  const budgetNum = parseFloat((recipeBudget||'').replace(',','.'));
  const hasBudget = !isNaN(budgetNum) && budgetNum > 0;
  let list = RECIPES;
  if(recipeCat !== 'alla') list = list.filter(r=>r.category===recipeCat);
  if(hasBudget) list = list.filter(r=>r.estimatedTotalCost==null || r.estimatedTotalCost<=budgetNum);
  const tabs = ['alla','protein','healthy','family','vegetarian'].map(c=>{
    const active = recipeCat===c;
    const label = c==='alla' ? 'Alla' : RECIPE_CAT_LABELS[c];
    const count = c==='alla' ? RECIPES.length : RECIPES.filter(r=>r.category===c).length;
    return `<button onclick="setRecipeCat('${c}')" style="flex:none;padding:9px 14px;border-radius:12px;border:${active?'none':'1px solid #EFE6D8'};background:${active?'#2A211A':'#fff'};color:${active?'#fff':'#6A5E50'};font-weight:700;font-size:13px;cursor:pointer;font-family:${FAM};white-space:nowrap;">${label} (${count})</button>`;
  }).join('');
  const intro = `<div style="background:linear-gradient(135deg,#4F7A3F,#3E6632);border-radius:22px;padding:20px 22px;color:#fff;margin-bottom:16px;box-shadow:0 12px 28px rgba(79,122,63,.26);">
      <div style="font-size:13px;opacity:.92;font-weight:600;">🍳 ${RECIPES.length} recept från veckans erbjudanden i ${esc(currentAreaName)}</div>
      <div style="font-size:13.5px;opacity:.92;margin-top:6px;line-height:1.5;">40 recept i 4 kategorier genereras automatiskt varje måndag utifrån det som faktiskt är på extrapris just den här veckan — inte alla mallar hittar en match varje vecka.</div>
      <button onclick="showWeeklyMenu=true; render();" style="margin-top:12px;padding:11px 16px;border-radius:12px;border:none;background:#fff;color:#3E6632;font-weight:800;font-size:13px;cursor:pointer;font-family:${FAM};">🗓️ Bygg veckomeny</button>
    </div>`;
  const householdRow = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;background:#fff;border:1px solid #EFE6D8;border-radius:14px;padding:10px 14px;">
      <span style="font-size:13px;font-weight:700;color:#6A5E50;">👨‍👩‍👧‍👦 Hushåll</span>
      <button onclick="setHouseholdSize(householdSize-1)" style="flex:none;width:30px;height:30px;border-radius:9px;border:1px solid #EFE6D8;background:#FBF6EE;font-size:16px;font-weight:800;cursor:pointer;">−</button>
      <span style="flex:none;min-width:20px;text-align:center;font-weight:800;font-size:14px;">${householdSize}</span>
      <button onclick="setHouseholdSize(householdSize+1)" style="flex:none;width:30px;height:30px;border-radius:9px;border:1px solid #EFE6D8;background:#FBF6EE;font-size:16px;font-weight:800;cursor:pointer;">+</button>
      <span style="font-size:12px;color:#8A7E6E;">personer — skalar ingredienser och pris</span>
    </div>`;
  const budgetRow = `<div style="display:flex;gap:10px;margin-bottom:14px;align-items:center;">
      <input id="recipe_budget" type="number" inputmode="decimal" value="${esc(recipeBudget)}" oninput="setRecipeBudget(this.value)" placeholder="Budget i kr för hela receptet (valfritt)" style="${inputStyle()}">
      ${hasBudget?`<button onclick="setRecipeBudget('')" style="flex:none;padding:0 14px;height:44px;border-radius:12px;border:1px solid #EFE6D8;background:#fff;color:#6A5E50;font-weight:700;font-size:13px;cursor:pointer;font-family:${FAM};">Rensa</button>`:''}
    </div>`;
  const tabRow = `<div style="display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px;">${tabs}</div>`;
  const body = list.length ? list.map(recipeCard).join('') :
    `<div style="text-align:center;padding:40px 20px;color:#8A7E6E;font-size:14px;">${RECIPES.length===0?'Inga recept genererade för din stad än — kolla tillbaka på måndag.':'Inga recept matchar filtret just nu.'}</div>`;
  return intro + householdRow + budgetRow + tabRow + body;
}

function inputStyle(){ return `width:100%;padding:12px;border-radius:12px;border:1px solid #E3D8C6;background:#fff;font-size:15px;font-family:${FAM};color:#2A211A;outline:none;`; }
function storeOptions(){ return STORES.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join(''); }
function catOptions(){ return CAT_ORDER.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join(''); }
function seg(on){ return `flex:1;padding:10px;border-radius:11px;border:none;background:${on?'#fff':'transparent'};color:${on?'#2A211A':'#8A7E6E'};font-weight:${on?700:600};font-size:13.5px;cursor:pointer;font-family:${FAM};box-shadow:${on?'0 2px 6px rgba(0,0,0,.07)':'none'};`; }
function lbl(t){ return `<span style="font-size:12.5px;font-weight:700;color:#6A5E50;display:block;margin-bottom:6px;">${t}</span>`; }
function sheetView(){
  if(!sheet) return '';
  const erb = mode==='erbjudande';
  const body = erb ? `
    <div style="font-size:13px;color:#8A7E6E;margin:10px 2px 16px;">Lägg till ett fynd du hittat i veckan.</div>
    <label style="display:block;margin-bottom:13px;">${lbl('Butik')}<select id="f_store" style="${inputStyle()}"><option value="">Välj butik…</option>${storeOptions()}</select></label>
    <label style="display:block;margin-bottom:13px;">${lbl('Produkt')}<input id="f_name" placeholder="t.ex. Kycklingfilé 900g" style="${inputStyle()}"></label>
    <label style="display:block;margin-bottom:13px;">${lbl('Detaljer')}<input id="f_details" placeholder="t.ex. fryst, 2-pack" style="${inputStyle()}"></label>
    <label style="display:block;margin-bottom:13px;">${lbl('Kategori')}<select id="f_cat" style="${inputStyle()}">${catOptions()}</select></label>
    <div style="display:flex;gap:12px;margin-bottom:18px;">
      <label style="flex:1;">${lbl('Rea-pris (kr)')}<input id="f_sale" type="number" inputmode="decimal" placeholder="59" style="${inputStyle()}"></label>
      <label style="flex:1;">${lbl('Ordinarie (kr)')}<input id="f_ord" type="number" inputmode="decimal" placeholder="89" style="${inputStyle()}"></label>
    </div>
    <div style="display:flex;gap:10px;">
      <button onclick="closeSheet()" style="flex:none;padding:13px 18px;border:1px solid #E3D8C6;border-radius:14px;background:#fff;color:#6A5E50;font-weight:700;font-size:15px;font-family:${FAM};cursor:pointer;">Avbryt</button>
      <button onclick="submitOffer()" style="flex:1;padding:13px;border:none;border-radius:14px;background:#E0552E;color:#fff;font-weight:700;font-size:15px;font-family:${FAM};cursor:pointer;">✅ Lägg till erbjudande</button>
    </div>` : `
    <div style="font-size:13px;color:#8A7E6E;margin:10px 2px 16px;">För saker som inte är på rea, t.ex. mjölk eller bröd.</div>
    <label style="display:block;margin-bottom:13px;">${lbl('Vara')}<input id="f_name" placeholder="t.ex. Mjölk 1,5 L" style="${inputStyle()}"></label>
    <label style="display:block;margin-bottom:13px;">${lbl('Butik')}<select id="f_store" style="${inputStyle()}"><option value="ovrigt">Valfri butik</option>${storeOptions()}</select></label>
    <div style="display:flex;gap:12px;margin-bottom:18px;">
      <label style="flex:1;">${lbl('Kategori')}<select id="f_cat" style="${inputStyle()}">${catOptions()}</select></label>
      <label style="width:96px;flex:none;">${lbl('Antal')}<input id="f_qty" type="number" inputmode="numeric" min="1" value="1" style="${inputStyle()}"></label>
    </div>
    <div style="display:flex;gap:10px;">
      <button onclick="closeSheet()" style="flex:none;padding:13px 18px;border:1px solid #E3D8C6;border-radius:14px;background:#fff;color:#6A5E50;font-weight:700;font-size:15px;font-family:${FAM};cursor:pointer;">Avbryt</button>
      <button onclick="submitCustom()" style="flex:1;padding:13px;border:none;border-radius:14px;background:#4F7A3F;color:#fff;font-weight:700;font-size:15px;font-family:${FAM};cursor:pointer;">✅ Lägg till på listan</button>
    </div>`;
  return `<div onclick="closeSheet()" style="position:fixed;inset:0;z-index:40;background:rgba(42,33,26,.45);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:vfFade .2s ease;">
    <div onclick="event.stopPropagation()" style="width:100%;max-width:520px;background:#FBF6EE;border-radius:26px 26px 0 0;padding:18px clamp(16px,4vw,24px) 30px;animation:vfSheet .3s cubic-bezier(.22,1,.36,1);max-height:92vh;overflow:auto;">
      <div style="width:40px;height:4px;background:#E0D5C2;border-radius:3px;margin:0 auto 16px;"></div>
      <div style="display:flex;background:#F0E8DA;border-radius:14px;padding:4px;margin-bottom:8px;">
        <button onclick="setMode('erbjudande')" style="${seg(erb)}">🏷️ Erbjudande</button>
        <button onclick="setMode('vara')" style="${seg(!erb)}">🛒 Egen vara</button>
      </div>${body}
    </div></div>`;
}
function fab(){ return `<button onclick="openSheet('erbjudande')" style="position:fixed;right:clamp(16px,4vw,28px);bottom:calc(24px + env(safe-area-inset-bottom));z-index:30;height:54px;padding:0 22px;border:none;border-radius:17px;background:#E0552E;color:#fff;font-family:${DISP};font-weight:700;font-size:16px;box-shadow:0 10px 26px rgba(224,85,46,.42);cursor:pointer;display:flex;align-items:center;gap:8px;">✏️ Erbjudande</button>`; }

function render(){
  const main = tab==='erbjudanden'?viewOffers():tab==='butiker'?viewStores():tab==='recept'?viewRecipes():tab==='bevaka'?viewWatchlist():tab==='halsa'?viewHealth():viewList();
  document.getElementById('app').innerHTML =
    header() +
    `<main style="${PAGE}padding-bottom:96px;animation:vfFade .3s ease;">${main}</main>` +
    fab() + sheetView() + toastView();
  if(tab==='butiker' && !catalogLoading) setTimeout(renderStoreMap, 0);
}
function go(t){ tab=t; if(t!=='erbjudanden') cat='Alla'; render(); }
function setCat(c){ cat=c; offersVisibleCount=OFFERS_PAGE_SIZE; render(); }
function showMoreOffers(){ offersVisibleCount += OFFERS_PAGE_SIZE; render(); }
function openSheet(m){ sheet=true; mode=m; render(); }
function closeSheet(){ sheet=null; render(); }
function setMode(m){ mode=m; render(); }

// ── Init ──────────────────────────────────────────────────
render();
loadCatalog();
sbAuth.auth.onAuthStateChange((_event, sess)=>{ session = sess; loadAuthAndHousehold(); });
loadAuthAndHousehold();
setInterval(loadShoppingList, 5000);
</script>
</body>

<!-- redeploy-trigger -->
</html>
