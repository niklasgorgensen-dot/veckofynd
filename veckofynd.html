async function authHeaders(){
  const { data } = await sbAuth.auth.getSession();
  const s = data.session || null;
  const token = s ? s.access_token : SUPA_KEY;
  return { apikey: SUPA_KEY, Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
}
const supa = {
  async selectRaw(path){ const h = await authHeaders(); const r = await fetch(`${SUPA_URL}/rest/v1/${path}`, { headers: h }); return r.json(); },
  async fetchAllDeals(idsCsv, todayStr){
    const pageSize = 1000;
    let offset = 0, all = [];
    while(true){
      const page = await this.selectRaw(`deals?select=*&store_id=in.(${idsCsv})&or=(valid_to.is.null,valid_to.gte.${todayStr})&order=scraped_at.desc,id.asc&limit=${pageSize}&offset=${offset}`);
      if(!Array.isArray(page) || page.length===0) break;
      all = all.concat(page);
      if(page.length < pageSize) break;
      offset += pageSize;
    }
    return all;
  },
  async fetchAllProductLinks(idsCsv){
    const pageSize = 1000;
    let offset = 0, all = [];
    while(true){
      const page = await this.selectRaw(`product_store_links?select=store_id,raw_product_text,product_id&store_id=in.(${idsCsv})&limit=${pageSize}&offset=${offset}`);
      if(!Array.isArray(page) || page.length===0) break;
      all = all.concat(page);
      if(page.length < pageSize) break;
      offset += pageSize;
    }
    return all;
  },
  async delete(table, id){ const h = await authHeaders(); await fetch(`${SUPA_URL}/rest/v1/${table}?id=eq.${id}`, { method:'DELETE', headers: h }); },
  async deleteWhere(table, filter){ const h = await authHeaders(); await fetch(`${SUPA_URL}/rest/v1/${table}?${filter}`, { method:'DELETE', headers: h }); },
  async update(table, id, data){ const h = await authHeaders(); await fetch(`${SUPA_URL}/rest/v1/${table}?id=eq.${id}`, { method:'PATCH', headers:{...h, Prefer:'return=minimal'}, body: JSON.stringify(data) }); },
  async insert(table, row){ const h = await authHeaders(); return fetch(`${SUPA_URL}/rest/v1/${table}`, { method:'POST', headers:{...h, Prefer:'resolution=merge-duplicates'}, body: JSON.stringify(row) }); }
};

let session = null, authEmailSent = false, householdLoadError = false;
let household = null, householdMembers = [], householdInvites = [];
async function loadAuthAndHousehold(isRetry){
  const { data } = await sbAuth.auth.getSession();
  session = data.session || null;
  if(!session){ household=null; householdMembers=[]; householdInvites=[]; householdLoadError=false; render(); return; }
  householdLoadError = false;
  try{
    const mems = await supa.selectRaw('household_members?select=*');
    if(!Array.isArray(mems)) throw new Error('bad response');
    const mine = mems.find(m=>m.user_id===session.user.id);
    if(mine){
      const hh = await supa.selectRaw(`households?select=*&id=eq.${mine.household_id}`);
      household = Array.isArray(hh) && hh[0] ? hh[0] : {id:mine.household_id};
      const roster = await supa.selectRaw(`household_members?select=*&household_id=eq.${mine.household_id}&order=joined_at.asc`);
      householdMembers = Array.isArray(roster) ? roster : [];
      const invites = await supa.selectRaw(`household_invites?select=*&household_id=eq.${mine.household_id}`);
      householdInvites = Array.isArray(invites) ? invites : [];
    } else if(!isRetry){
      // Brand-new signup: the DB trigger that creates the household may not have committed yet.
      setTimeout(()=>loadAuthAndHousehold(true), 1200);
      return;
    } else {
      householdLoadError = true;
    }
  }catch(e){ householdLoadError = true; }
  render();
  loadShoppingList();
  loadWatchlist();
}
async function loadShoppingList(){
  if(!household){ shoppingList=[]; return; }
  try{
    const rows = await supa.selectRaw(`shopping_list?select=*&household_id=eq.${household.id}&order=inserted_at.asc`);
    if(Array.isArray(rows)){
      shoppingList = rows.map(r=>({ id:r.id, store:r.store, product:r.product, detail:r.detail||'', price:Number(r.price)||0,
        origPrice:r.orig_price!=null?Number(r.orig_price):Number(r.price)||0, unit:r.unit||'', category:r.category||'Skafferivaror',
        emoji:r.emoji||'🛒', checked:!!r.checked, qty:r.qty||1, isCustom:!!r.is_custom }));
      render();
    }
  }catch(e){ /* tyst */ }
}
async function loadWatchlist(){
  if(!household){ watchlist=[]; return; }
  try{
    const rows = await supa.selectRaw(`watchlist_items?select=*&household_id=eq.${household.id}&order=created_at.asc`);
    if(Array.isArray(rows)){ watchlist = rows.map(r=>({ id:r.id, term:r.term })); render(); }
  }catch(e){ /* tyst */ }
}
async function addWatchTerm(){
  if(!session || !household) return;
  const el = document.getElementById('watch_term');
  const term = (el||{}).value||'';
  if(!term.trim()) return;
  if(watchlist.some(w=>w.term.toLowerCase()===term.trim().toLowerCase())){ showToast('Bevakar redan den varan'); return; }
  const id = crypto.randomUUID();
  watchlist.push({ id, term: term.trim() }); if(el) el.value=''; render();
  try{ await supa.insert('watchlist_items', { id, household_id:household.id, added_by:session.user.id, term: term.trim() }); }catch(e){ /* tyst */ }
}
async function removeWatchItem(id){
  watchlist = watchlist.filter(w=>w.id!==id); render();
  try{ await supa.deleteWhere('watchlist_items', `id=eq.${id}`); }catch(e){ /* tyst */ }
}

  matdax:{color:"#FF6B00",logo:"🟠"}, matvarlden:{color:"#7A4FBC",logo:"🟣"}, lidl:{color:"#0050AA",logo:"🔷"}, hemkop:{color:"#E6007E",logo:"💗"}
};

function mapStoreRow(r){
  const fb = CHAIN_FALLBACK[r.chain] || {color:"#B6A893",logo:"🛒"};
  return { id:r.id, name:r.name, color:r.color||fb.color, logo:fb.logo, logoUrl:r.logo_url,

    lat:r.lat!=null?Number(r.lat):null, lng:r.lng!=null?Number(r.lng):null, areaId:r.area_id };
}
function saveFollowed(){ localStorage.setItem('vf_followed_stores', JSON.stringify(Array.from(followedStoreIds))); }
function recomputeScope(){
  if(followedStoreIds.size){
    STORES = ALL_STORES.filter(s=>followedStoreIds.has(s.id));
  } else if(currentAreaId){
    STORES = ALL_STORES.filter(s=>s.areaId===currentAreaId);
  } else STORES = [];
  const ids = new Set(STORES.map(s=>s.id));
  deals = ALL_DEALS.filter(d=>ids.has(d.store));
  annotateCheaperElsewhere(deals);
}
// For each deal, checks whether the same canonical product (via product_store_links,
// built by match-products) is cheaper at another store within the current scope.
// Only compares within scope (followed stores / current area) -- a cheaper price
// at a store the user doesn't shop at isn't actionable. Requires >0.5kr difference
// to filter out rounding noise between otherwise-identical prices.
function annotateCheaperElsewhere(scopedDeals){
  const byProduct = new Map();
  for(const d of scopedDeals){
    const pid = LINK_BY_KEY.get(`${d.store}::${d.product}`);
    d.cheaperElsewhere = null;
    if(!pid) continue;
    if(!byProduct.has(pid)) byProduct.set(pid, []);
    byProduct.get(pid).push(d);
  }
  for(const d of scopedDeals){
    const pid = LINK_BY_KEY.get(`${d.store}::${d.product}`);
    if(!pid) continue;
    const group = byProduct.get(pid);
    let best = null;
    for(const other of group){
      if(other.store===d.store) continue;
      if(!best || other.price < best.price) best = other;
    }
    if(best && best.price < d.price - 0.5){
      d.cheaperElsewhere = { storeName: storeById(best.store).name, price: best.price, unit: best.unit };
    }
  }
}
function toggleFollow(storeId){
  if(followedStoreIds.has(storeId)) followedStoreIds.delete(storeId); else followedStoreIds.add(storeId);
  saveFollowed(); recomputeScope(); render();
}
function mapDealRow(r){
  return { id:r.id, store:r.store_id, product:r.product, detail:r.detail||'', price:Number(r.price),
    origPrice:r.orig_price!=null?Number(r.orig_price):Number(r.price), unit:r.unit||'st', category:r.category||'Skafferivaror',
    emoji:r.emoji||'🛒', hot:!!r.hot, validTo:r.valid_to||null,
    jamforpris:r.jamforpris!=null?Number(r.jamforpris):null, jamforenhet:r.jamforenhet||null,
    brand:r.brand||null, imageUrl:r.image_url||null };
}
async function loadAreas(){
  try{
    const cityRows = await supa.selectRaw('cities?select=*&order=name.asc');
    if(Array.isArray(cityRows)) CITIES = cityRows;
    const rows = await supa.selectRaw('areas?select=*&order=name.asc');
    if(Array.isArray(rows)) AREAS = rows;
    if(!currentCityId && CITIES.length){ currentCityId = CITIES[0].id; currentCityName = CITIES[0].name; }
    else if(currentCityId){ const c = CITIES.find(x=>x.id===currentCityId); if(c) currentCityName = c.name; }
    const areasInCity = AREAS.filter(a=>a.city_id===currentCityId);
    if((!currentAreaId || !areasInCity.some(a=>a.id===currentAreaId)) && areasInCity.length){
      currentAreaId = areasInCity[0].id; currentAreaName = areasInCity[0].name;
    } else if(currentAreaId){ const a = AREAS.find(x=>x.id===currentAreaId); if(a) currentAreaName = a.name; }
  }catch(e){ /* offline */ }
}
async function loadCatalog(){
  catalogLoading = true; catalogError = null; render();
  try{
    await loadAreas();
    const allRows = await supa.selectRaw('stores?select=*&active=eq.true&order=name.asc');
    ALL_STORES = Array.isArray(allRows) ? allRows.map(mapStoreRow) : [];
    const allIds = ALL_STORES.map(s=>s.id);
    if(allIds.length){
      const todayStr = new Date().toISOString().slice(0,10);
      const dealRows = await supa.fetchAllDeals(allIds.join(','), todayStr);
      ALL_DEALS = dealRows.map(mapDealRow);
      const linkRows = await supa.fetchAllProductLinks(allIds.join(','));
      LINK_BY_KEY = new Map(linkRows.map(l=>[`${l.store_id}::${l.raw_product_text}`, l.product_id]));
    } else { ALL_DEALS = []; LINK_BY_KEY = new Map(); }
    recomputeScope();
  }catch(e){ catalogError = 'Kunde inte hämta erbjudanden.'; }
  catalogLoading = false; render();
}
function switchCity(id){
  const c = CITIES.find(x=>x.id===id); if(!c) return;
  currentCityId = c.id; currentCityName = c.name;
  localStorage.setItem('vf_city_id', c.id); localStorage.setItem('vf_city_name', c.name);
  const areasInCity = AREAS.filter(a=>a.city_id===id);
  if(areasInCity.length){
    currentAreaId = areasInCity[0].id; currentAreaName = areasInCity[0].name;
    localStorage.setItem('vf_area_id', currentAreaId); localStorage.setItem('vf_area_name', currentAreaName);
  }
  recomputeScope(); render();
}
function switchArea(id){
  const a = AREAS.find(x=>x.id===id); if(!a) return;
  currentAreaId = a.id; currentAreaName = a.name;
  localStorage.setItem('vf_area_id', a.id); localStorage.setItem('vf_area_name', a.name);
  recomputeScope(); render();
}

function getWeekInfo() {
  const now = new Date();
  const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const ftDay = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - ftDay + 3);
  const week = 1 + Math.round((d - firstThursday) / (7 * 24 * 3600 * 1000));
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  const fmt = dt => dt.toLocaleDateString('sv-SE', { day: 'numeric', month: 'short' });
  return { week, range: `${fmt(monday)}–${fmt(sunday)}` };
}

const FALLBACK_STORE = { name:'Övrigt', color:'#B6A893', distance:'' };
function storeById(id){ return STORES.find(s=>s.id===id) || ALL_STORES.find(s=>s.id===id) || FALLBACK_STORE; }
function storeLogo(st, size, radius){
  radius = radius || Math.round(size*0.3);
  const fallback = `<div style="width:${size}px;height:${size}px;border-radius:${radius}px;background:${st.color};color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:${Math.round(size*0.42)}px;flex:none;">${esc((st.name||'?')[0])}</div>`;
  if(!st.logoUrl) return fallback;
  const fbEsc = fallback.replace(/'/g,"\\'").replace(/"/g,'&quot;');
  return `<div style="width:${size}px;height:${size}px;border-radius:${radius}px;background:#fff;border:1px solid #EFE6D8;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;padding:${Math.round(size*0.12)}px;box-sizing:border-box;"><img src="${st.logoUrl}" alt="${esc(st.name)}" style="width:100%;height:100%;object-fit:contain;" onerror="this.parentElement.outerHTML='${fbEsc}'"></div>`;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function kr(n){ if(n==null||isNaN(n)) return '0 kr'; return (Number.isInteger(n)? String(n) : Number(n).toFixed(2).replace('.',',')) + ' kr'; }
function unitSuffix(u){ return u==='kg'?'/kg':u==='liter'?'/liter':u==='st'?'/st':u==='förp'?'/st':''; }
function isPerUnitDiscount(u){ return u==='st'||u==='förp'; }

function normalize(s){ return (s||'').toLowerCase().replace(/[åä]/g,'a').replace(/ö/g,'o').replace(/[-_,.]/g,' ').trim(); }
function matchDealsForTerm(term){
  const n = normalize(term);
  return ALL_DEALS.filter(d => {
    const dp = normalize(d.product), dd = normalize(d.detail||'');
    return n.split(' ').every(w => dp.includes(w) || dd.includes(w));
  }).sort((a,b) => ((b.origPrice-b.price)/(b.origPrice||1)) - ((a.origPrice-a.price)/(a.origPrice||1)));
}

function searchDeals(){
  const el = document.getElementById('deal_search');
  searchInput = el ? el.value.trim() : searchInput;
  if(!searchInput) return;
  const terms = searchInput.split(/[,\n]+/).map(t=>t.trim()).filter(Boolean);
  searchResults = terms.map(term => ({ term, hits: matchDealsForTerm(term) }));
  searchDone = true;
  render();
}

function scaleAmount(amount, unit, factor){
  if(!amount || factor===1) return amount;
  let n;
  const s = String(amount);
  if(s.includes('/')){ const [a,b]=s.split('/'); n = parseFloat(a)/parseFloat(b); } else { n = parseFloat(s.replace(',','.')); }
  if(isNaN(n)) return amount;
  const scaled = n * factor;
  const discrete = ['st','förp','paket','burk','skivor','kvistar'];
  if(discrete.includes(unit)) return String(Math.max(1, Math.ceil(scaled)));
  if(scaled >= 10) return String(Math.round(scaled/5)*5);
  if(scaled >= 1) return (Math.round(scaled*2)/2).toString();
  return (Math.round(scaled*4)/4).toString();
}

function inList(id){ return shoppingList.some(i=>i.id===id); }
async function addOffer(id){
  if(!session){ showToast('🔐 Logga in för att lägga till på listan'); tab='lista'; render(); return; }
  if(!household){ showToast('⚠️ Kunde inte ladda ditt hushåll'); tab='lista'; render(); return; }

}
async function toggleItem(id){
  const it = shoppingList.find(i=>i.id===id); if(!it) return;
  it.checked = !it.checked; markWrite(); render();

function detectMember(o){
  const d = (o.detail||'').toLowerCase(), p = (o.product||'').toLowerCase();
  if(/med lidl plus|lidl plus kupong|lidl\+/i.test(d+p)) return {label:'Kräver Lidl Plus',color:'#1A4F8A',bg:'#DEEAF8'};
  if(/stammis|ica stammis/i.test(d+p))                    return {label:'Kräver ICA Stammis',color:'#B80000',bg:'#FADEDE'};
  if(/matv.rlden vip|vip-pris/i.test(d+p))                return {label:'Kräver Matvärlden VIP',color:'#5A2D8A',bg:'#EDE3F8'};
  if(/hemköp plus|hemkop plus/i.test(d+p))                return {label:'Kräver Hemköp Plus',color:'#8A1A5A',bg:'#F8DEEE'};
  if(/coop members/i.test(d+p))                           return {label:'Kräver Coop Membership',color:'#005B8E',bg:'#D8EEF8'};
  if(/willys plus|willys\+/i.test(d+p))                  return {label:'Kräver Willys Plus',color:'#8A1A1A',bg:'#F8DEDE'};
  if(o.member)                                             return {label:'Kräver medlemskap',color:'#4A4A4A',bg:'#EBEBEB'};
  return null;
}

function renderStoreMap(){
  const el = document.getElementById('vf-map');
  if(!el || typeof L === 'undefined' || !ALL_STORES.length) return;
  if(vfMap){ try{ vfMap.remove(); }catch(e){} vfMap = null; }
  vfMap = L.map('vf-map', {scrollWheelZoom:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(vfMap);
  vfMapMarkers = {};
  const pts = [];
  const mapStores = ALL_STORES.filter(st=>{
    const a = AREAS.find(x=>x.id===st.areaId);
    return (a && a.city_id===currentCityId) || followedStoreIds.has(st.id);
  });
  mapStores.forEach(st=>{
    if(st.lat==null || st.lng==null) return;
    pts.push([st.lat, st.lng]);
    const followed = followedStoreIds.has(st.id);
    const icon = L.divIcon({className:'', html:`<div class="vf-pin" style="background:${followed?'#E0552E':st.color};"><span>${followed?'✓':(st.logo||'🛒')}</span></div>`, iconSize:[30,30], iconAnchor:[15,30]});
    const marker = L.marker([st.lat, st.lng], {icon}).addTo(vfMap);
    marker.bindPopup(`<b>${esc(st.name)}</b><br>${followed?'Följs — klicka för att sluta följa':'Klicka på nålen för att följa'}`);
    marker.on('click', ()=>toggleFollow(st.id));
    vfMapMarkers[st.id] = marker;
  });
  if(pts.length) vfMap.fitBounds(pts, {padding:[24,24], maxZoom:14});
  setTimeout(()=>vfMap && vfMap.invalidateSize(), 80);
}

function renderSearchResults(){

  const notFound = searchResults.filter(r=>r.hits.length===0);

  // Bygg en butikskarta: vilken butik täcker flest söktermer?
  const storeScore = {};
  found.forEach(r => {
    const best = r.hits[0]; // bäst rabatt för denna term
    storeScore[best.store] = (storeScore[best.store]||0) + 1;
  });
  const bestStore = Object.entries(storeScore).sort((a,b)=>b[1]-a[1])[0];

  const foundRows = found.map(r => {
    const best = r.hits[0];
    const st = storeById(best.store);
    const disc = best.origPrice > best.price ? `<span style="color:#E0552E;font-weight:800;font-size:11px;margin-left:6px;">-${Math.round((1-best.price/best.origPrice)*100)}%</span>` : '';

    const btn = already
      ? `<span style="font-size:11px;color:#4F7A3F;font-weight:700;">✓ Tillagd</span>`
      : `<button onclick="addSearchHit(${best.id})" style="padding:5px 12px;border:none;border-radius:9px;background:#2A211A;color:#fff;font-weight:700;font-size:12px;font-family:${FAM};cursor:pointer;">+ Lägg till</button>`;

  const tipRow = bestStore && storeScore[bestStore[0]] > 1
    ? `<div style="margin-top:10px;background:#EAF1E3;border-radius:12px;padding:10px 14px;font-size:12.5px;color:#3E6632;font-weight:700;">

  return `<div style="background:#fff;border:1px solid #EFE6D8;border-radius:18px;overflow:hidden;margin-bottom:4px;box-shadow:0 2px 10px rgba(42,33,26,.04);">

      ${found.length} fynd hittade • ${notFound.length} saknas denna vecka

    ${foundRows}${notFoundRows}
  </div>${tipRow}`;
}

      <input id="watch_term" placeholder="t.ex. kycklingfilé, kaffe, laxfilé…" style="${inputStyle()}" onkeydown="if(event.key==='Enter')addWatchTerm()">
      <button onclick="addWatchTerm()" style="flex:none;padding:0 18px;border:none;border-radius:12px;background:#2A211A;color:#fff;font-weight:700;font-size:14px;font-family:${FAM};cursor:pointer;">Bevaka</button>
    </div>`;
  const rows = watchlist.length ? watchlist.map(watchItemRow).join('') :
    `<div style="text-align:center;padding:40px 20px;color:#8A7E6E;">
      <div style="font-size:48px;">👁️</div>
      <div style="font-family:${DISP};font-weight:700;font-size:18px;margin-top:10px;color:#2A211A;">Inget bevakas än</div>
      <div style="font-size:13.5px;margin-top:6px;">Lägg till en vara ovan så håller vi koll åt dig.</div>
    </div>`;
  return intro + addBox + rows;
}
function toggleDesc(uid){
  const el = document.getElementById('desc_'+uid);
  const btn = document.getElementById('descbtn_'+uid);
  if(!el||!btn) return;
  const expanded = el.dataset.expanded === '1';
  if(expanded){
    el.style.webkitLineClamp = '2';
    el.style.overflow = 'hidden';
    el.dataset.expanded = '0';
    btn.textContent = 'Läs mer…';
  } else {
    el.style.webkitLineClamp = 'unset';
    el.style.overflow = 'visible';
    el.dataset.expanded = '1';
    btn.textContent = 'Visa mindre';
  }
}
const RECIPE_CAT_LABELS = {protein:'💪 Proteinrikt', healthy:'🥗 Hälsosamt', family:'👨‍👩‍👧 Familj', vegetarian:'🌱 Vegetariskt'};
async function loadRecipes(){
  if(recipesLoadedForArea === currentAreaId) return;
  try{
    const rows = await supa.selectRaw(`recipes?select=*&area_id=eq.${currentAreaId}&order=category.asc`);
    RECIPES = Array.isArray(rows) ? rows.map(r=>({
      id:r.id, category:r.category, title:r.title, description:r.description, servings:r.servings,
      steps:r.steps||[], ingredients:r.ingredients||[], estimatedTotalCost:r.estimated_total_cost, matchScore:r.match_score,
      kcal:r.kcal, proteinG:r.protein_g, carbsG:r.carbs_g, fatG:r.fat_g
    })) : [];
    recipesLoadedForArea = currentAreaId;
  }catch(e){ RECIPES = []; }
  render();
}
function setRecipeCat(c){ recipeCat = c; render(); }
function setRecipeBudget(v){ recipeBudget = v; localStorage.setItem('vf_recipe_budget', v); render(); }
let recipeCardSeq = 0;
function recipeCard(r){
  const uid = 'r' + (recipeCardSeq++);
  const scaleFactor = householdSize / (r.servings || 4);
  const descHtml = r.description ? `<div style="margin-bottom:12px;">
      <span id="desc_${uid}" data-expanded="0" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:#5A4F43;line-height:1.5;">${esc(r.description)}</span>
      <span id="descbtn_${uid}" onclick="toggleDesc('${uid}')" style="display:inline-block;margin-top:4px;color:#4F7A3F;font-weight:700;cursor:pointer;font-size:12.5px;">Läs mer…</span>
    </div>` : '';
  const matchCount = (r.ingredients||[]).filter(i=>i.fromDealId).length;
  const ingRows = (r.ingredients||[]).map(ing=>{
    const tag = ing.fromDealId!=null ? `<span style="margin-left:auto;flex:none;font-size:11px;font-weight:700;color:#3E6632;background:#EAF1E3;padding:3px 8px;border-radius:8px;">${esc(storeById(ing.store).name)} · ${kr(ing.price)}</span>` : '';
    const scaledAmt = scaleAmount(ing.amount, ing.unit, scaleFactor);
    return `<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #F3ECDF;font-size:13.5px;"><span>${esc(scaledAmt||'')} ${esc(ing.unit||'')} ${esc(ing.name||'')}</span>${tag}</div>`;
  }).join('');
  const steps = (r.steps||[]).map((s,i)=>`<div style="display:flex;gap:10px;padding:6px 0;font-size:13.5px;line-height:1.5;"><span style="flex:none;width:22px;height:22px;border-radius:50%;background:#F0E8DA;color:#6A5E50;font-weight:800;font-size:11.5px;display:flex;align-items:center;justify-content:center;">${i+1}</span><span>${esc(s)}</span></div>`).join('');
  return `<div style="background:#fff;border:1px solid #EFE6D8;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(42,33,26,.04);">
    <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:4px;">
      <div style="flex:1;font-family:${DISP};font-weight:800;font-size:18px;line-height:1.2;">${esc(r.title||'Recept')}</div>
      ${matchCount?`<div style="flex:none;font-size:11.5px;font-weight:700;color:#C2431F;background:#FBEAE2;padding:5px 9px;border-radius:9px;">${matchCount} fynd använda</div>`:''}
    </div>
    <div style="font-size:12.5px;color:#8A7E6E;margin-bottom:10px;">${householdSize} port · ${r.estimatedTotalCost!=null?`ca ${kr(r.estimatedTotalCost*scaleFactor)} totalt`:''}</div>
    ${r.kcal!=null?`<div style="font-size:10.5px;font-weight:700;color:#B6A893;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;">Näringsvärde per portion</div>` : ''}
    ${r.kcal!=null?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">
      <span style="font-size:11.5px;font-weight:700;color:#8A5A2B;background:#FBF0DE;padding:4px 9px;border-radius:8px;">${r.kcal} kcal</span>
      <span style="font-size:11.5px;font-weight:700;color:#3E6632;background:#EAF1E3;padding:4px 9px;border-radius:8px;">P ${r.proteinG}g</span>
      <span style="font-size:11.5px;font-weight:700;color:#7A4FBC;background:#F1EAFB;padding:4px 9px;border-radius:8px;">K ${r.carbsG}g</span>
      <span style="font-size:11.5px;font-weight:700;color:#C2431F;background:#FBEAE2;padding:4px 9px;border-radius:8px;">F ${r.fatG}g</span>
    </div>`:''}
    ${descHtml}
    <div style="margin-bottom:10px;">${ingRows}</div>
    <div>${steps}</div>
  </div>`;
}
function buildWeeklyMenu(){
  const cats = ['family','protein','healthy','vegetarian','family'];
  const used = new Set(); const menu = [];
  for(const cat of cats){
    const pool = RECIPES.filter(r=>r.category===cat && !used.has(r.id));
    if(pool.length){ const pick = pool[0]; used.add(pick.id); menu.push(pick); }
  }
  weeklyMenu = menu; render();
}
function swapMenuRecipe(idx){
  if(!weeklyMenu) return;
  const cur = weeklyMenu[idx];
  const used = new Set(weeklyMenu.map(r=>r.id));
  const pool = RECIPES.filter(r=>r.category===cur.category && !used.has(r.id));
  if(pool.length){ weeklyMenu[idx] = pool[0]; render(); }
  else showToast('Inga fler recept i den kategorin denna vecka');
}
async function addMenuToShoppingList(){
  if(!session){ showToast('🔐 Logga in för att lägga till på listan'); tab='lista'; render(); return; }
  if(!household){ showToast('⚠️ Kunde inte ladda ditt hushåll'); tab='lista'; render(); return; }
  if(!weeklyMenu || !weeklyMenu.length) return;
  const merged = {};
  for(const r of weeklyMenu){
    for(const ing of (r.ingredients||[])){
      const key = (ing.name||'').toLowerCase();
      if(!key) continue;
      if(!merged[key]) merged[key] = { name: ing.name, parts: [], price: null, store: null, fromDealId: null };
      const scaledAmt = scaleAmount(ing.amount, ing.unit, householdSize/(r.servings||4));
      merged[key].parts.push(`${scaledAmt||''} ${ing.unit||''}`.trim());
      if(ing.fromDealId && merged[key].fromDealId==null){ merged[key].fromDealId = ing.fromDealId; merged[key].price = ing.price; merged[key].store = ing.store; }
    }
  }
  let addedCount = 0;
  for(const key in merged){
    const m = merged[key];
    const id = Date.now() + Math.floor(Math.random()*100000);
    const isCustom = m.fromDealId == null;
    const st = m.store || 'ovrigt';
    const item = { id, store: st, product: m.name, detail: m.parts.filter(Boolean).join(' + '), price: m.price||0, origPrice: m.price||0, unit: 'st', category: 'Skafferivaror', emoji: '🛒', checked:false, qty:1, isCustom };
    shoppingList.push(item); addedCount++;
    try{ await supa.insert('shopping_list', { id, household_id:household.id, added_by:session.user.id, store:st, product:item.product, detail:item.detail, price:item.price, orig_price:item.origPrice, unit:'st', category:item.category, emoji:item.emoji, checked:false, qty:1, is_custom:isCustom }); }catch(e){}
  }
  markWrite(); tab='lista'; showToast(`✓ ${addedCount} varor tillagda från veckomenyn`); render();
}
function viewWeeklyMenu(){
  if(!weeklyMenu) buildWeeklyMenu();
  if(!weeklyMenu) return '';
  const totalKcal = weeklyMenu.reduce((s,r)=>s+(r.kcal||0),0);
  const totalProtein = weeklyMenu.reduce((s,r)=>s+(Number(r.proteinG)||0),0);
  const totalCost = weeklyMenu.reduce((s,r)=>s+((r.estimatedTotalCost||0)*(householdSize/(r.servings||4))),0);
  const days = ['Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag','Söndag'];
  const rows = weeklyMenu.map((r,i)=>`
    <div style="background:#fff;border:1px solid #EFE6D8;border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;">
      <div style="flex:none;width:66px;font-size:12px;font-weight:800;color:#8A7E6E;">${days[i]||'Dag '+(i+1)}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-family:${DISP};font-weight:800;font-size:15px;line-height:1.25;">${esc(r.title)}</div>
        <div style="font-size:11.5px;color:#8A7E6E;margin-top:2px;">${r.kcal?r.kcal+' kcal · ':''}${r.estimatedTotalCost!=null?'ca '+kr(r.estimatedTotalCost):''}</div>
      </div>
      <button onclick="swapMenuRecipe(${i})" style="flex:none;width:38px;height:38px;border-radius:11px;border:1px solid #EFE6D8;background:#fff;font-size:16px;cursor:pointer;">🔄</button>
    </div>`).join('');
  return `<div style="background:linear-gradient(135deg,#4F7A3F,#3E6632);border-radius:22px;padding:20px 22px;color:#fff;margin-bottom:16px;box-shadow:0 12px 28px rgba(79,122,63,.26);">
      <div style="font-size:13px;opacity:.92;font-weight:600;">🗓️ Din veckomeny — ${weeklyMenu.length} middagar</div>
      <div style="font-size:13.5px;opacity:.92;margin-top:6px;line-height:1.5;">${weeklyMenu.length?('Ca '+Math.round(totalKcal/weeklyMenu.length)+' kcal · '+Math.round(totalProtein/weeklyMenu.length)+'g protein per dag i snitt'):''}${totalCost?' · ca '+kr(totalCost)+' för hela veckan':''}</div>
    </div>
    ${rows}
    <div style="display:flex;gap:10px;margin-top:6px;">
      <button onclick="buildWeeklyMenu()" style="flex:1;padding:14px;border-radius:14px;border:1px solid #EFE6D8;background:#fff;color:#2A211A;font-weight:700;font-size:14px;cursor:pointer;font-family:${FAM};">🎲 Nytt förslag</button>
      <button onclick="addMenuToShoppingList()" style="flex:1;padding:14px;border-radius:14px;border:none;background:#2A211A;color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:${FAM};">📋 Lägg till alla varor i listan</button>
    </div>
    <button onclick="showWeeklyMenu=false; render();" style="width:100%;margin-top:10px;padding:12px;border-radius:12px;border:none;background:transparent;color:#8A7E6E;font-weight:600;font-size:13px;cursor:pointer;font-family:${FAM};">← Tillbaka till alla recept</button>`;
}
function viewRecipes(){
  if(recipesLoadedForArea !== currentAreaId) loadRecipes();
  if(showWeeklyMenu) return viewWeeklyMenu();
  const budgetNum = parseFloat((recipeBudget||'').replace(',','.'));
  const hasBudget = !isNaN(budgetNum) && budgetNum > 0;
  let list = RECIPES;
  if(recipeCat !== 'alla') list = list.filter(r=>r.category===recipeCat);
  if(hasBudget) list = list.filter(r=>r.estimatedTotalCost==null || r.estimatedTotalCost<=budgetNum);
  const tabs = ['alla','protein','healthy','family','vegetarian'].map(c=>{
    const active = recipeCat===c;
    const label = c==='alla' ? 'Alla' : RECIPE_CAT_LABELS[c];
    const count = c==='alla' ? RECIPES.length : RECIPES.filter(r=>r.category===c).length;
    return `<button onclick="setRecipeCat('${c}')" style="flex:none;padding:9px 14px;border-radius:12px;border:${active?'none':'1px solid #EFE6D8'};background:${active?'#2A211A':'#fff'};color:${active?'#fff':'#6A5E50'};font-weight:700;font-size:13px;cursor:pointer;font-family:${FAM};white-space:nowrap;">${label} (${count})</button>`;
  }).join('');
  const intro = `<div style="background:linear-gradient(135deg,#4F7A3F,#3E6632);border-radius:22px;padding:20px 22px;color:#fff;margin-bottom:16px;box-shadow:0 12px 28px rgba(79,122,63,.26);">
      <div style="font-size:13px;opacity:.92;font-weight:600;">🍳 ${RECIPES.length} recept från veckans erbjudanden i ${esc(currentAreaName)}</div>
      <div style="font-size:13.5px;opacity:.92;margin-top:6px;line-height:1.5;">40 recept i 4 kategorier genereras automatiskt varje måndag utifrån det som faktiskt är på extrapris just den här veckan — inte alla mallar hittar en match varje vecka.</div>
      <button onclick="showWeeklyMenu=true; render();" style="margin-top:12px;padding:11px 16px;border-radius:12px;border:none;background:#fff;color:#3E6632;font-weight:800;font-size:13px;cursor:pointer;font-family:${FAM};">🗓️ Bygg veckomeny</button>
    </div>`;
  const householdRow = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;background:#fff;border:1px solid #EFE6D8;border-radius:14px;padding:10px 14px;">
      <span style="font-size:13px;font-weight:700;color:#6A5E50;">👨‍👩‍👧‍👦 Hushåll</span>
      <button onclick="setHouseholdSize(householdSize-1)" style="flex:none;width:30px;height:30px;border-radius:9px;border:1px solid #EFE6D8;background:#FBF6EE;font-size:16px;font-weight:800;cursor:pointer;">−</button>
      <span style="flex:none;min-width:20px;text-align:center;font-weight:800;font-size:14px;">${householdSize}</span>
      <button onclick="setHouseholdSize(householdSize+1)" style="flex:none;width:30px;height:30px;border-radius:9px;border:1px solid #EFE6D8;background:#FBF6EE;font-size:16px;font-weight:800;cursor:pointer;">+</button>
      <span style="font-size:12px;color:#8A7E6E;">personer — skalar ingredienser och pris</span>
    </div>`;
  const budgetRow = `<div style="display:flex;gap:10px;margin-bottom:14px;align-items:center;">
      <input id="recipe_budget" type="number" inputmode="decimal" value="${esc(recipeBudget)}" oninput="setRecipeBudget(this.value)" placeholder="Budget i kr för hela receptet (valfritt)" style="${inputStyle()}">
      ${hasBudget?`<button onclick="setRecipeBudget('')" style="flex:none;padding:0 14px;height:44px;border-radius:12px;border:1px solid #EFE6D8;background:#fff;color:#6A5E50;font-weight:700;font-size:13px;cursor:pointer;font-family:${FAM};">Rensa</button>`:''}
    </div>`;
  const tabRow = `<div style="display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px;">${tabs}</div>`;
  const body = list.length ? list.map(recipeCard).join('') :
    `<div style="text-align:center;padding:40px 20px;color:#8A7E6E;font-size:14px;">${RECIPES.length===0?'Inga recept genererade för din stad än — kolla tillbaka på måndag.':'Inga recept matchar filtret just nu.'}</div>`;
  return intro + householdRow + budgetRow + tabRow + body;
}

function inputStyle(){ return `width:100%;padding:12px;border-radius:12px;border:1px solid #E3D8C6;background:#fff;font-size:15px;font-family:${FAM};color:#2A211A;outline:none;`; }
function storeOptions(){ return STORES.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join(''); }
function catOptions(){ return CAT_ORDER.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join(''); }
function seg(on){ return `flex:1;padding:10px;border-radius:11px;border:none;background:${on?'#fff':'transparent'};color:${on?'#2A211A':'#8A7E6E'};font-weight:${on?700:600};font-size:13.5px;cursor:pointer;font-family:${FAM};box-shadow:${on?'0 2px 6px rgba(0,0,0,.07)':'none'};`; }
function lbl(t){ return `<span style="font-size:12.5px;font-weight:700;color:#6A5E50;display:block;margin-bottom:6px;">${t}</span>`; }

    </div>`;
  return `<div onclick="closeSheet()" style="position:fixed;inset:0;z-index:40;background:rgba(42,33,26,.45);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:vfFade .2s ease;">
    <div onclick="event.stopPropagation()" style="width:100%;max-width:520px;background:#FBF6EE;border-radius:26px 26px 0 0;padding:18px clamp(16px,4vw,24px) 30px;animation:vfSheet .3s cubic-bezier(.22,1,.36,1);max-height:92vh;overflow:auto;">
      <div style="width:40px;height:4px;background:#E0D5C2;border-radius:3px;margin:0 auto 16px;"></div>

        <button onclick="setMode('erbjudande')" style="${seg(erb)}">🏷️ Erbjudande</button>
        <button onclick="setMode('vara')" style="${seg(!erb)}">🛒 Egen vara</button>
      </div>${body}

function fab(){ return `<button onclick="openSheet('erbjudande')" style="position:fixed;right:clamp(16px,4vw,28px);bottom:calc(24px + env(safe-area-inset-bottom));z-index:30;height:54px;padding:0 22px;border:none;border-radius:17px;background:#E0552E;color:#fff;font-family:${DISP};font-weight:700;font-size:16px;box-shadow:0 10px 26px rgba(224,85,46,.42);cursor:pointer;display:flex;align-items:center;gap:8px;">✏️ Erbjudande</button>`; }

function render(){
  const main = tab==='erbjudanden'?viewOffers():tab==='butiker'?viewStores():tab==='recept'?viewRecipes():tab==='bevaka'?viewWatchlist():viewList();

loadCatalog();
sbAuth.auth.onAuthStateChange((_event, sess)=>{ session = sess; loadAuthAndHousehold(); });
