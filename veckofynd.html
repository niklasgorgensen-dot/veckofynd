async function authHeaders(){
  const { data } = await sbAuth.auth.getSession();
  const s = data.session || null;
  const token = s ? s.access_token : SUPA_KEY;
  return { apikey: SUPA_KEY, Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
}
const supa = {
  async selectRaw(path){ const h = await authHeaders(); const r = await fetch(`${SUPA_URL}/rest/v1/${path}`, { headers: h }); return r.json(); },
  // Fetches every row of a query, paginated. Was sequential (one page, await,
  // next page, await...) -- with 30k+ deals and 29k+ product_store_links rows
  // that meant 60 round trips taken one at a time, ~14s just to open the app.
  // PostgREST returns the true row count in the Content-Range header when
  // asked (Prefer: count=exact), so the first page tells us how many pages
  // are left -- fire all of those concurrently instead of waiting in turn.
  async fetchAllPaginated(pathWithoutPaging){
    const pageSize = 1000;
    const h = await authHeaders();
    const firstUrl = `${SUPA_URL}/rest/v1/${pathWithoutPaging}&limit=${pageSize}&offset=0`;
    const firstRes = await fetch(firstUrl, { headers: { ...h, Prefer: 'count=exact' } });
    const firstPage = await firstRes.json();
    if(!Array.isArray(firstPage)) return [];
    const range = firstRes.headers.get('content-range'); // "0-999/30015"
    const total = range && range.includes('/') ? parseInt(range.split('/')[1], 10) : NaN;
    if(!Number.isFinite(total) || total <= firstPage.length) return firstPage;

    const pageCount = Math.ceil(total / pageSize);
    const requests = [];
    for(let p = 1; p < pageCount; p++){
      const offset = p * pageSize;
      requests.push(fetch(`${SUPA_URL}/rest/v1/${pathWithoutPaging}&limit=${pageSize}&offset=${offset}`, { headers: h }).then(r=>r.json()));
    }
    const restPages = await Promise.all(requests);
    let all = firstPage.slice();
    for(const page of restPages) if(Array.isArray(page)) all = all.concat(page);
    return all;
  },
  // Trimmed to the columns mapDealRow actually reads -- `select=*` was
  // pulling ean/limited_days/valid_from/scraped_at/source on every one of
  // 22k+ rows too (each JSON field repeats its key name per row, so 5 unused
  // columns cost real bytes at this scale: ~19% smaller payload measured on
  // a real 200-row sample). order=scraped_at.desc still works even though
  // scraped_at isn't selected -- PostgREST orders the underlying table, not
  // the projection.
  async fetchAllDeals(idsCsv, todayStr){
    const cols = 'id,store_id,product,detail,price,orig_price,unit,category,emoji,hot,valid_to,jamforpris,jamforenhet,brand,image_url,origin,promo_label';
    return this.fetchAllPaginated(`deals?select=${cols}&store_id=in.(${idsCsv})&or=(valid_to.is.null,valid_to.gte.${todayStr})&order=scraped_at.desc,id.asc`);
  },
  async fetchAllProductLinks(idsCsv){
    return this.fetchAllPaginated(`product_store_links?select=store_id,raw_product_text,product_id&store_id=in.(${idsCsv})`);
  },
  async fetchAllProducts(){
    return this.fetchAllPaginated(`products?select=id,image_url,brand,origin`);
  },
  async delete(table, id){ const h = await authHeaders(); await fetch(`${SUPA_URL}/rest/v1/${table}?id=eq.${id}`, { method:'DELETE', headers: h }); },
  async deleteWhere(table, filter){ const h = await authHeaders(); await fetch(`${SUPA_URL}/rest/v1/${table}?${filter}`, { method:'DELETE', headers: h }); },
  async update(table, id, data){ const h = await authHeaders(); await fetch(`${SUPA_URL}/rest/v1/${table}?id=eq.${id}`, { method:'PATCH', headers:{...h, Prefer:'return=minimal'}, body: JSON.stringify(data) }); },
  async insert(table, row){ const h = await authHeaders(); return fetch(`${SUPA_URL}/rest/v1/${table}`, { method:'POST', headers:{...h, Prefer:'resolution=merge-duplicates'}, body: JSON.stringify(row) }); }
};

}

let session = null, authEmailSent = false, householdLoadError = false;
let household = null, householdMembers = [], householdInvites = [];
async function loadAuthAndHousehold(isRetry){
  const { data } = await sbAuth.auth.getSession();
  session = data.session || null;
  if(!session){ household=null; householdMembers=[]; householdInvites=[]; householdLoadError=false; nutritionGoal=null; todayActivity=null; todayFoodLogs=[]; render(); return; }
  householdLoadError = false;
  try{
    const mems = await supa.selectRaw('household_members?select=*');
    if(!Array.isArray(mems)) throw new Error('bad response');
    const mine = mems.find(m=>m.user_id===session.user.id);
    if(mine){
      const hh = await supa.selectRaw(`households?select=*&id=eq.${mine.household_id}`);
      household = Array.isArray(hh) && hh[0] ? hh[0] : {id:mine.household_id};
      const roster = await supa.selectRaw(`household_members?select=*&household_id=eq.${mine.household_id}&order=joined_at.asc`);
      householdMembers = Array.isArray(roster) ? roster : [];
      const invites = await supa.selectRaw(`household_invites?select=*&household_id=eq.${mine.household_id}`);
      householdInvites = Array.isArray(invites) ? invites : [];
    } else if(!isRetry){
      // Brand-new signup: the DB trigger that creates the household may not have committed yet.
      setTimeout(()=>loadAuthAndHousehold(true), 1200);
      return;
    } else {
      householdLoadError = true;
    }
  }catch(e){ householdLoadError = true; }
  render();
  loadShoppingList();
  loadWatchlist();
  loadNutritionGoal();
  loadTodayActivity();
  loadTodayFoodLogs();
}
async function loadShoppingList(){
  if(!household){ shoppingList=[]; return; }
  try{
    const rows = await supa.selectRaw(`shopping_list?select=*&household_id=eq.${household.id}&order=inserted_at.asc`);
    if(Array.isArray(rows)){
      const next = rows.map(r=>({ id:r.id, dealId:r.deal_id!=null?Number(r.deal_id):null, store:r.store, product:r.product, detail:r.detail||'', price:Number(r.price)||0,
        origPrice:r.orig_price!=null?Number(r.orig_price):Number(r.price)||0, unit:r.unit||'', category:r.category||'Skafferivaror',
        emoji:r.emoji||'🛒', checked:!!r.checked, qty:r.qty||1, isCustom:!!r.is_custom }));
      // The 5s poll below re-fetches unconditionally, but a full render() tears
      // down and rebuilds the entire app (including the offer grid's images)
      // via innerHTML -- doing that every 5s regardless of change caused the
      // constant mid-scroll jank users were hitting. Only re-render on an
      // actual data change (e.g. another household member edited the list).
      const changed = JSON.stringify(next) !== JSON.stringify(shoppingList);
      shoppingList = next;
      if(changed) render();
    }
  }catch(e){ /* tyst */ }
}

    if(Array.isArray(rows)){ watchlist = rows.map(r=>({ id:r.id, term:r.term })); render(); }

}

async function saveNutritionGoal(){
  if(!session || !nutritionGoal) return;
  const kcal = Math.max(800, parseInt((document.getElementById('goal_kcal')||{}).value)||nutritionGoal.baseKcalGoal);
  const protein = Math.max(0, parseFloat((document.getElementById('goal_protein')||{}).value)||nutritionGoal.proteinGoalG);
  const strategy = healthGoalStrategyDraft || nutritionGoal.calorieStrategy;
  const partialPct = Math.max(0, Math.min(100, parseFloat((document.getElementById('goal_partial_pct')||{}).value)||nutritionGoal.partialAdjustmentPct));
  nutritionGoal = { ...nutritionGoal, baseKcalGoal:kcal, proteinGoalG:protein, calorieStrategy:strategy, partialAdjustmentPct:partialPct };
  healthGoalStrategyDraft = null; render(); showToast('✓ Mål sparade');
  try{ await supa.insert('nutrition_goals', { user_id:session.user.id, base_kcal_goal:kcal, protein_goal_g:protein, calorie_strategy:strategy, partial_adjustment_pct:partialPct, updated_at:new Date().toISOString() }); }catch(e){ /* tyst */ }
}

function recomputeScope(){
  // A follow persists in localStorage across sessions/devices, and it wins
  // the STORES computation below unconditionally. If the user's city has
  // since diverged from where a followed store lives -- via an explicit
  // switchCity(), OR just because the page loaded straight into a
  // localStorage-persisted city from a PRIOR session while an old follow
  // from a different city was still sitting in vf_followed_stores -- that
  // stale follow silently and permanently overrides the current city's
  // whole view, with zero visible explanation beyond a small "Rensa valda
  // butiker" button buried in the Butiker tab. Self-heal HERE (every time
  // scope is recomputed, not only inside switchCity()) so it's fixed
  // regardless of how the mismatch arose. Guarded on AREAS/ALL_STORES
  // actually being loaded, so an early call before the catalog has landed
  // can't wipe a legitimate follow just because there's nothing to check
  // it against yet.
  if(followedStoreIds.size && AREAS.length && ALL_STORES.length){
    const areaCity = new Map(AREAS.map(a=>[a.id, a.city_id]));
    const inCity = new Set(ALL_STORES.filter(s=>followedStoreIds.has(s.id) && areaCity.get(s.areaId)===currentCityId).map(s=>s.id));
    if(inCity.size !== followedStoreIds.size){ followedStoreIds = inCity; saveFollowed(); }
  }
  if(followedStoreIds.size){
    STORES = ALL_STORES.filter(s=>followedStoreIds.has(s.id));
  } else if(currentAreaId){
    STORES = ALL_STORES.filter(s=>s.areaId===currentAreaId);
  } else STORES = [];
  const ids = new Set(STORES.map(s=>s.id));
  deals = ALL_DEALS.filter(d=>ids.has(d.store));
  annotateCheaperElsewhere(deals);
}
// For each deal, checks whether the same canonical product (via product_store_links,
// built by match-products) is cheaper at another store within the current scope.
// Only compares within scope (followed stores / current area) -- a cheaper price
// at a store the user doesn't shop at isn't actionable. Requires >0.5kr difference
// to filter out rounding noise between otherwise-identical prices.
function annotateCheaperElsewhere(scopedDeals){
  const byProduct = new Map();
  for(const d of scopedDeals){
    const pid = LINK_BY_KEY.get(`${d.store}::${d.product}`);
    d.cheaperElsewhere = null;
    if(!pid) continue;
    if(!byProduct.has(pid)) byProduct.set(pid, []);
    byProduct.get(pid).push(d);
  }
  for(const d of scopedDeals){
    const pid = LINK_BY_KEY.get(`${d.store}::${d.product}`);
    if(!pid) continue;
    const group = byProduct.get(pid);
    let best = null;
    for(const other of group){
      if(other.store===d.store) continue;
      if(!best || other.price < best.price) best = other;
    }
    if(best && best.price < d.price - 0.5){
      d.cheaperElsewhere = { storeName: storeById(best.store).name, price: best.price, unit: best.unit };
    }
  }
}

// Most chains only put brand/image on a minority of their own deals -- if
// match-products has already linked this deal's raw text to a canonical
// product that SOME other chain supplied brand/image for, borrow it here
// rather than leaving the card blank.
function fillSharedBrandImageOrigin(dealRows, linkByKey, productRows){
  const productById = new Map(productRows.map(p=>[p.id, p]));
  for(const d of dealRows){
    const pid = linkByKey.get(`${d.store}::${d.product}`);
    if(!pid) continue;
    const p = productById.get(pid);
    if(!p) continue;
    if(!d.imageUrl && p.image_url) d.imageUrl = p.image_url;
    if(!d.brand && p.brand) d.brand = p.brand;
    if(!d.origin && p.origin) d.origin = p.origin;
  }
}
// With 399 stores and 22k+ live deals nationally, downloading the WHOLE
// catalog before the first render made the app feel frozen for several
// seconds on every open, even after fetchAllPaginated already parallelized
// the page requests -- the bottleneck moved from round-trips to sheer
// payload size. Fix: fetch only what the user is about to actually SEE
// (their current area, or their followed stores if they have any -- same
// priority recomputeScope() itself uses) first and render that immediately,
// then keep loading the full national catalog in the background so
// switching city/area, following an out-of-area store, and cross-area
// search all still work exactly as before once that finishes a moment later.
const STORE_COLS = 'id,area_id,chain,name,address,distance_km,hours,color,logo_url,website_url,scrape_config,lat,lng';
async function loadScopedFirst(){
  let idsCsv = null;
  if(followedStoreIds.size){
    idsCsv = Array.from(followedStoreIds).join(',');
  } else if(currentAreaId){
    const rows = await supa.selectRaw(`stores?select=id&active=eq.true&area_id=eq.${currentAreaId}`);
    idsCsv = Array.isArray(rows) && rows.length ? rows.map(r=>r.id).join(',') : null;
  }
  if(!idsCsv){ ALL_STORES = []; ALL_DEALS = []; LINK_BY_KEY = new Map(); recomputeScope(); return; }
  const storeRows = await supa.selectRaw(`stores?select=${STORE_COLS}&id=in.(${idsCsv})`);
  ALL_STORES = Array.isArray(storeRows) ? storeRows.map(mapStoreRow) : [];
  const todayStr = new Date().toISOString().slice(0,10);
  const [dealRows, linkRows] = await Promise.all([
    supa.fetchAllDeals(idsCsv, todayStr),
    supa.fetchAllProductLinks(idsCsv),
  ]);
  ALL_DEALS = dealRows.map(mapDealRow);
  LINK_BY_KEY = new Map(linkRows.map(l=>[`${l.store_id}::${l.raw_product_text}`, l.product_id]));
  // Used to filter to id=in.(...) of just this area's linked product IDs --
  // with match-products now producing 20k+ links nationally, one area's
  // distinct product-id list grew past the URL length PostgREST/Cloudflare
  // will accept, so this request 400'd and the whole app got stuck on
  // "Hämtar veckans erbjudanden…" forever. products is a small table (a
  // few thousand rows); loadFullCatalogInBackground already fetches it
  // in full with fetchAllProducts(), so do the same here instead of
  // filtering by an ever-growing id list in the URL.
  const productRows = await supa.fetchAllProducts();
  fillSharedBrandImageOrigin(ALL_DEALS, LINK_BY_KEY, productRows);
  recomputeScope();
}
async function loadFullCatalogInBackground(){
  try{
    const allRows = await supa.selectRaw(`stores?select=${STORE_COLS}&active=eq.true&order=name.asc`);
    const allStores = Array.isArray(allRows) ? allRows.map(mapStoreRow) : [];
    const allIds = allStores.map(s=>s.id);
    let allDeals = [], linkByKey = new Map();
    if(allIds.length){
      const todayStr = new Date().toISOString().slice(0,10);
      const [dealRows, linkRows, productRows] = await Promise.all([
        supa.fetchAllDeals(allIds.join(','), todayStr),
        supa.fetchAllProductLinks(allIds.join(',')),
        supa.fetchAllProducts(),
      ]);
      allDeals = dealRows.map(mapDealRow);
      linkByKey = new Map(linkRows.map(l=>[`${l.store_id}::${l.raw_product_text}`, l.product_id]));
      fillSharedBrandImageOrigin(allDeals, linkByKey, productRows);
    }
    ALL_STORES = allStores; ALL_DEALS = allDeals; LINK_BY_KEY = linkByKey;
    recomputeScope(); render();
  }catch(e){ /* first-paint data is already showing; the next app open retries */ }
}
async function loadCatalog(){
  catalogLoading = true; catalogError = null; render();
  try{
    await loadAreas();
    await loadScopedFirst();
  }catch(e){ catalogError = 'Kunde inte hämta erbjudanden.'; }
  catalogLoading = false; render();
  if(!catalogError) loadFullCatalogInBackground();
}
function switchCity(id){
  const c = CITIES.find(x=>x.id===id); if(!c) return;
  currentCityId = c.id; currentCityName = c.name;
  localStorage.setItem('vf_city_id', c.id); localStorage.setItem('vf_city_name', c.name);
  // Cross-city follow pruning now happens inside recomputeScope() itself
  // (self-heals on every scope computation, not just an explicit city
  // switch) -- see the comment there for why that's necessary.
  const areasInCity = AREAS.filter(a=>a.city_id===id);
  if(areasInCity.length){
    currentAreaId = areasInCity[0].id; currentAreaName = areasInCity[0].name;
    localStorage.setItem('vf_area_id', currentAreaId); localStorage.setItem('vf_area_name', currentAreaName);
  }
  recomputeScope(); render();
}
function switchArea(id){
  const a = AREAS.find(x=>x.id===id); if(!a) return;
  currentAreaId = a.id; currentAreaName = a.name;
  localStorage.setItem('vf_area_id', a.id); localStorage.setItem('vf_area_name', a.name);
  recomputeScope(); render();
}

function getWeekInfo() {
  const now = new Date();
  const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const ftDay = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - ftDay + 3);
  const week = 1 + Math.round((d - firstThursday) / (7 * 24 * 3600 * 1000));
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  const fmt = dt => dt.toLocaleDateString('sv-SE', { day: 'numeric', month: 'short' });
  return { week, range: `${fmt(monday)}–${fmt(sunday)}` };
}

function normalize(s){ return (s||'').toLowerCase().replace(/[åä]/g,'a').replace(/ö/g,'o').replace(/[-_,.]/g,' ').trim(); }
function matchDealsForTerm(term){
  const n = normalize(term);
  return ALL_DEALS.filter(d => {
    const dp = normalize(d.product), dd = normalize(d.detail||'');
    return n.split(' ').every(w => dp.includes(w) || dd.includes(w));
  }).sort((a,b) => ((b.origPrice-b.price)/(b.origPrice||1)) - ((a.origPrice-a.price)/(a.origPrice||1)));
}

// even between people who share a shopping list). `source` on every row

let nutritionGoal = null, todayActivity = null, todayFoodLogs = [];

function computeKcalGoalToday(){
  if(!nutritionGoal) return 2200;
  const base = nutritionGoal.baseKcalGoal;
  const active = (todayActivity && todayActivity.activeCalories) || 0;
  if(nutritionGoal.calorieStrategy==='dynamic') return Math.round(base + active);
  if(nutritionGoal.calorieStrategy==='partial') return Math.round(base + active*(nutritionGoal.partialAdjustmentPct/100));
  return base;
}

function scaleAmount(amount, unit, factor){
  if(!amount || factor===1) return amount;
  let n;
  const s = String(amount);
  if(s.includes('/')){ const [a,b]=s.split('/'); n = parseFloat(a)/parseFloat(b); } else { n = parseFloat(s.replace(',','.')); }
  if(isNaN(n)) return amount;
  const scaled = n * factor;
  const discrete = ['st','förp','paket','burk','skivor','kvistar'];
  if(discrete.includes(unit)) return String(Math.max(1, Math.ceil(scaled)));
  if(scaled >= 10) return String(Math.round(scaled/5)*5);
  if(scaled >= 1) return (Math.round(scaled*2)/2).toString();
  return (Math.round(scaled*4)/4).toString();
}

// ── Butiker nära dig (postnummer/ort/geolocation sök) ────────
// North-star feature: search any Swedish postnummer or ort and get the
// nearest stores back, sorted by distance, regardless of the user's
// currently selected city/area -- distinct from the existing area
// dropdown, which only ever lists ONE preset area at a time. Geocoding via
// Nominatim (OpenStreetMap) since the map already depends on OSM tiles, no
// new API key needed; distance uses the same flat-earth approximation the
// backend already uses for area-assignment (accurate enough at this scale,
// consistent with the rest of the codebase).
function isSwedishPostalCode(s){ return /^\d{3}\s?\d{2}$/.test(s.trim()); }
function distanceKm(lat1, lng1, lat2, lng2){
  const avgLat = (lat1+lat2)/2;
  const dlat = (lat2-lat1)*111.0;
  const dlng = (lng2-lng1)*111.0*Math.cos(avgLat*Math.PI/180);
  return Math.sqrt(dlat*dlat + dlng*dlng);
}
async function geocodeLocation(query){
  const q = query.trim();
  if(!q) return null;
  const params = isSwedishPostalCode(q)
    ? `postalcode=${encodeURIComponent(q)}&country=Sweden`
    : `q=${encodeURIComponent(q + ', Sverige')}`;
  const res = await fetch(`https://nominatim.openstreetmap.org/search?${params}&format=jsonv2&limit=1`, { headers: { 'Accept-Language': 'sv' } });
  if(!res.ok) return null;
  const rows = await res.json();
  if(!Array.isArray(rows) || !rows.length) return null;
  return { lat: Number(rows[0].lat), lng: Number(rows[0].lon), label: rows[0].display_name || q };
}
function computeStoreSearchResults(){
  if(!storeSearchOrigin) return;
  const { lat, lng } = storeSearchOrigin;
  storeSearchResults = ALL_STORES
    .filter(st=>st.lat!=null && st.lng!=null)
    .map(st=>({ st, dist: distanceKm(lat, lng, st.lat, st.lng) }))
    .sort((a,b)=>a.dist-b.dist)
    .slice(0, 24);
}
async function searchStoresNear(){
  const el = document.getElementById('store_search_input');
  storeSearchInput = el ? el.value.trim() : storeSearchInput;
  if(!storeSearchInput){ storeSearchError = 'Skriv ett postnummer eller en ort.'; render(); return; }
  storeSearchLoading = true; storeSearchError = null; render();
  let origin = null;
  try{ origin = await geocodeLocation(storeSearchInput); }catch(e){ origin = null; }
  storeSearchLoading = false;
  if(!origin){ storeSearchError = `Hittade inte "${storeSearchInput}". Prova ett postnummer (t.ex. 184 40) eller en ort.`; storeSearchResults = null; render(); return; }
  storeSearchOrigin = origin;
  computeStoreSearchResults();
  render();
}
function useMyLocation(){
  if(!navigator.geolocation){ storeSearchError = 'Din enhet stödjer inte platsdelning.'; render(); return; }
  storeSearchLoading = true; storeSearchError = null; render();
  navigator.geolocation.getCurrentPosition(
    pos=>{
      storeSearchLoading = false;
      storeSearchOrigin = { lat: pos.coords.latitude, lng: pos.coords.longitude, label: 'Min plats' };
      storeSearchInput = 'Min plats';
      computeStoreSearchResults();
      render();
    },
    ()=>{ storeSearchLoading = false; storeSearchError = 'Kunde inte hämta din plats. Kontrollera platsbehörighet.'; render(); },
    { timeout: 10000 }
  );
}
function clearStoreSearch(){

}

function storeCardData(st, items){

function dealsByStore(){

  }).sort((a,b)=>(a===currentAreaId?-1:b===currentAreaId?1:0));

}

function addStoreMarker(st){
  if(st.lat==null || st.lng==null) return null;
  const followed = followedStoreIds.has(st.id);
  const icon = L.divIcon({className:'', html:`<div class="vf-pin" style="background:${followed?'#E0552E':st.color};"><span>${followed?'✓':(st.logo||'🛒')}</span></div>`, iconSize:[30,30], iconAnchor:[15,30]});
  const marker = L.marker([st.lat, st.lng], {icon}).addTo(vfMap);
  marker.bindPopup(`<b>${esc(st.name)}</b><br>${followed?'Följs — klicka för att sluta följa':'Klicka på nålen för att följa'}`);
  marker.on('click', ()=>toggleFollow(st.id));
  vfMapMarkers[st.id] = marker;
  return [st.lat, st.lng];
}
function renderStoreMap(){
  const el = document.getElementById('vf-map');
  if(!el || typeof L === 'undefined') return;
  if(vfMap){ try{ vfMap.remove(); }catch(e){} vfMap = null; }
  vfMap = L.map('vf-map', {scrollWheelZoom:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(vfMap);
  vfMapMarkers = {};
  const pts = [];
  if(storeSearchResults){
    if(storeSearchOrigin){
      pts.push([storeSearchOrigin.lat, storeSearchOrigin.lng]);
      const originIcon = L.divIcon({className:'', html:'<div class="vf-pin" style="background:#2A211A;"><span>📍</span></div>', iconSize:[30,30], iconAnchor:[15,30]});
      L.marker([storeSearchOrigin.lat, storeSearchOrigin.lng], {icon: originIcon}).addTo(vfMap).bindPopup('Din sökning');
    }
    storeSearchResults.forEach(({st})=>{ const p = addStoreMarker(st); if(p) pts.push(p); });
  } else {
    if(!ALL_STORES.length) return;
    const areaCity = new Map(AREAS.map(a=>[a.id, a.city_id]));
    const mapStores = ALL_STORES.filter(st=> areaCity.get(st.areaId)===currentCityId || followedStoreIds.has(st.id));
    mapStores.forEach(st=>{ const p = addStoreMarker(st); if(p) pts.push(p); });
  }
  if(pts.length) vfMap.fitBounds(pts, {padding:[24,24], maxZoom:14});
  setTimeout(()=>vfMap && vfMap.invalidateSize(), 80);
}

function renderSearchResults(){
  if(!searchResults || !searchResults.length) return '';
  const found = searchResults.filter(r=>r.hits.length>0);
  const notFound = searchResults.filter(r=>r.hits.length===0);

  // Bygg en butikskarta: vilken butik täcker flest söktermer?
  const storeScore = {};
  found.forEach(r => {
    const best = r.hits[0]; // bäst rabatt för denna term
    storeScore[best.store] = (storeScore[best.store]||0) + 1;
  });
  const bestStore = Object.entries(storeScore).sort((a,b)=>b[1]-a[1])[0];

  const foundRows = found.map(r => {
    const best = r.hits[0];
    const st = storeById(best.store);
    const disc = best.origPrice > best.price ? `<span style="color:#E0552E;font-weight:800;font-size:11px;margin-left:6px;">-${Math.round((1-best.price/best.origPrice)*100)}%</span>` : '';
    const already = inList(best.id);
    const btn = already
      ? `<span style="font-size:11px;color:#4F7A3F;font-weight:700;">✓ Tillagd</span>`
      : `<button onclick="addSearchHit(${best.id})" style="padding:5px 12px;border:none;border-radius:9px;background:#2A211A;color:#fff;font-weight:700;font-size:12px;font-family:${FAM};cursor:pointer;">+ Lägg till</button>`;

  const notFoundRows = notFound.length ? `<div style="padding:10px 14px;font-size:12.5px;color:#B6A893;">
    Inga fynd: ${notFound.map(r=>`<b>${esc(r.term)}</b>`).join(', ')}

  const tipRow = bestStore && storeScore[bestStore[0]] > 1
    ? `<div style="margin-top:10px;background:#EAF1E3;border-radius:12px;padding:10px 14px;font-size:12.5px;color:#3E6632;font-weight:700;">

      ${found.length} fynd hittade • ${notFound.length} saknas denna vecka

  </div>${tipRow}`;
}

function buildWeeklyMenu(){

  const used = new Set(); const menu = [];
  for(const cat of cats){
    const pool = RECIPES.filter(r=>r.category===cat && !used.has(r.id));
    if(pool.length){ const pick = pool[0]; used.add(pick.id); menu.push(pick); }
  }

}
function swapMenuRecipe(idx){
  if(!weeklyMenu) return;
  const cur = weeklyMenu[idx];
  const used = new Set(weeklyMenu.map(r=>r.id));
  const pool = RECIPES.filter(r=>r.category===cur.category && !used.has(r.id));
  if(pool.length){ weeklyMenu[idx] = pool[0]; render(); }

}

      <div style="font-size:13px;opacity:.92;font-weight:600;">🍳 ${RECIPES.length} recept från veckans erbjudanden i ${esc(currentAreaName)}</div>
      <div style="font-size:13.5px;opacity:.92;margin-top:6px;line-height:1.5;">40 recept i 4 kategorier genereras automatiskt varje måndag utifrån det som faktiskt är på extrapris just den här veckan — inte alla mallar hittar en match varje vecka.</div>
      <button onclick="showWeeklyMenu=true; render();" style="margin-top:12px;padding:11px 16px;border-radius:12px;border:none;background:#fff;color:#3E6632;font-weight:800;font-size:13px;cursor:pointer;font-family:${FAM};">🗓️ Bygg veckomeny</button>
    </div>`;
  const householdRow = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;background:#fff;border:1px solid #EFE6D8;border-radius:14px;padding:10px 14px;">
      <span style="font-size:13px;font-weight:700;color:#6A5E50;">👨‍👩‍👧‍👦 Hushåll</span>
      <button onclick="setHouseholdSize(householdSize-1)" style="flex:none;width:30px;height:30px;border-radius:9px;border:1px solid #EFE6D8;background:#FBF6EE;font-size:16px;font-weight:800;cursor:pointer;">−</button>
      <span style="flex:none;min-width:20px;text-align:center;font-weight:800;font-size:14px;">${householdSize}</span>
      <button onclick="setHouseholdSize(householdSize+1)" style="flex:none;width:30px;height:30px;border-radius:9px;border:1px solid #EFE6D8;background:#FBF6EE;font-size:16px;font-weight:800;cursor:pointer;">+</button>
      <span style="font-size:12px;color:#8A7E6E;">personer — skalar ingredienser och pris</span>
    </div>`;
  const budgetRow = `<div style="display:flex;gap:10px;margin-bottom:14px;align-items:center;">
      <input id="recipe_budget" type="number" inputmode="decimal" value="${esc(recipeBudget)}" oninput="setRecipeBudget(this.value)" placeholder="Budget i kr för hela receptet (valfritt)" style="${inputStyle()}">
      ${hasBudget?`<button onclick="setRecipeBudget('')" style="flex:none;padding:0 14px;height:44px;border-radius:12px;border:1px solid #EFE6D8;background:#fff;color:#6A5E50;font-weight:700;font-size:13px;cursor:pointer;font-family:${FAM};">Rensa</button>`:''}
    </div>`;
  const tabRow = `<div style="display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px;">${tabs}</div>`;
  const body = list.length ? list.map(recipeCard).join('') :
    `<div style="text-align:center;padding:40px 20px;color:#8A7E6E;font-size:14px;">${RECIPES.length===0?'Inga recept genererade för din stad än — kolla tillbaka på måndag.':'Inga recept matchar filtret just nu.'}</div>`;
  return intro + householdRow + budgetRow + tabRow + body;
}

function inputStyle(){ return `width:100%;padding:12px;border-radius:12px;border:1px solid #E3D8C6;background:#fff;font-size:15px;font-family:${FAM};color:#2A211A;outline:none;`; }
function storeOptions(){ return STORES.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join(''); }
function catOptions(){ return CAT_ORDER.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join(''); }
function seg(on){ return `flex:1;padding:10px;border-radius:11px;border:none;background:${on?'#fff':'transparent'};color:${on?'#2A211A':'#8A7E6E'};font-weight:${on?700:600};font-size:13.5px;cursor:pointer;font-family:${FAM};box-shadow:${on?'0 2px 6px rgba(0,0,0,.07)':'none'};`; }
function lbl(t){ return `<span style="font-size:12.5px;font-weight:700;color:#6A5E50;display:block;margin-bottom:6px;">${t}</span>`; }
function sheetView(){
  if(!sheet) return '';
  const erb = mode==='erbjudande';
  const body = erb ? `
    <div style="font-size:13px;color:#8A7E6E;margin:10px 2px 16px;">Lägg till ett fynd du hittat i veckan.</div>
    <label style="display:block;margin-bottom:13px;">${lbl('Butik')}<select id="f_store" style="${inputStyle()}"><option value="">Välj butik…</option>${storeOptions()}</select></label>
    <label style="display:block;margin-bottom:13px;">${lbl('Produkt')}<input id="f_name" placeholder="t.ex. Kycklingfilé 900g" style="${inputStyle()}"></label>
    <label style="display:block;margin-bottom:13px;">${lbl('Detaljer')}<input id="f_details" placeholder="t.ex. fryst, 2-pack" style="${inputStyle()}"></label>
    <label style="display:block;margin-bottom:13px;">${lbl('Kategori')}<select id="f_cat" style="${inputStyle()}">${catOptions()}</select></label>
    <div style="display:flex;gap:12px;margin-bottom:18px;">
      <label style="flex:1;">${lbl('Rea-pris (kr)')}<input id="f_sale" type="number" inputmode="decimal" placeholder="59" style="${inputStyle()}"></label>
      <label style="flex:1;">${lbl('Ordinarie (kr)')}<input id="f_ord" type="number" inputmode="decimal" placeholder="89" style="${inputStyle()}"></label>
    </div>
    <div style="display:flex;gap:10px;">
      <button onclick="closeSheet()" style="flex:none;padding:13px 18px;border:1px solid #E3D8C6;border-radius:14px;background:#fff;color:#6A5E50;font-weight:700;font-size:15px;font-family:${FAM};cursor:pointer;">Avbryt</button>
      <button onclick="submitOffer()" style="flex:1;padding:13px;border:none;border-radius:14px;background:#E0552E;color:#fff;font-weight:700;font-size:15px;font-family:${FAM};cursor:pointer;">✅ Lägg till erbjudande</button>
    </div>` : `
    <div style="font-size:13px;color:#8A7E6E;margin:10px 2px 16px;">För saker som inte är på rea, t.ex. mjölk eller bröd.</div>
    <label style="display:block;margin-bottom:13px;">${lbl('Vara')}<input id="f_name" placeholder="t.ex. Mjölk 1,5 L" style="${inputStyle()}"></label>
    <label style="display:block;margin-bottom:13px;">${lbl('Butik')}<select id="f_store" style="${inputStyle()}"><option value="ovrigt">Valfri butik</option>${storeOptions()}</select></label>
    <div style="display:flex;gap:12px;margin-bottom:18px;">
      <label style="flex:1;">${lbl('Kategori')}<select id="f_cat" style="${inputStyle()}">${catOptions()}</select></label>
      <label style="width:96px;flex:none;">${lbl('Antal')}<input id="f_qty" type="number" inputmode="numeric" min="1" value="1" style="${inputStyle()}"></label>
    </div>
    <div style="display:flex;gap:10px;">
      <button onclick="closeSheet()" style="flex:none;padding:13px 18px;border:1px solid #E3D8C6;border-radius:14px;background:#fff;color:#6A5E50;font-weight:700;font-size:15px;font-family:${FAM};cursor:pointer;">Avbryt</button>
      <button onclick="submitCustom()" style="flex:1;padding:13px;border:none;border-radius:14px;background:#4F7A3F;color:#fff;font-weight:700;font-size:15px;font-family:${FAM};cursor:pointer;">✅ Lägg till på listan</button>
    </div>`;
  return `<div onclick="closeSheet()" style="position:fixed;inset:0;z-index:40;background:rgba(42,33,26,.45);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:vfFade .2s ease;">
    <div onclick="event.stopPropagation()" style="width:100%;max-width:520px;background:#FBF6EE;border-radius:26px 26px 0 0;padding:18px clamp(16px,4vw,24px) 30px;animation:vfSheet .3s cubic-bezier(.22,1,.36,1);max-height:92vh;overflow:auto;">
      <div style="width:40px;height:4px;background:#E0D5C2;border-radius:3px;margin:0 auto 16px;"></div>
      <div style="display:flex;background:#F0E8DA;border-radius:14px;padding:4px;margin-bottom:8px;">
        <button onclick="setMode('erbjudande')" style="${seg(erb)}">🏷️ Erbjudande</button>
        <button onclick="setMode('vara')" style="${seg(!erb)}">🛒 Egen vara</button>
      </div>${body}
    </div></div>`;
}
function fab(){ return `<button onclick="openSheet('erbjudande')" style="position:fixed;right:clamp(16px,4vw,28px);bottom:calc(24px + env(safe-area-inset-bottom));z-index:30;height:54px;padding:0 22px;border:none;border-radius:17px;background:#E0552E;color:#fff;font-family:${DISP};font-weight:700;font-size:16px;box-shadow:0 10px 26px rgba(224,85,46,.42);cursor:pointer;display:flex;align-items:center;gap:8px;">✏️ Erbjudande</button>`; }

function render(){
  const main = tab==='erbjudanden'?viewOffers():tab==='butiker'?viewStores():tab==='recept'?viewRecipes():tab==='bevaka'?viewWatchlist():tab==='halsa'?viewHealth():viewList();
  document.getElementById('app').innerHTML =
    header() +
    `<main style="${PAGE}padding-bottom:96px;animation:vfFade .3s ease;">${main}</main>` +
    fab() + sheetView() + toastView();
  if(tab==='butiker' && !catalogLoading) setTimeout(renderStoreMap, 0);
}
function go(t){ tab=t; if(t!=='erbjudanden') cat='Alla'; render(); }
function setCat(c){ cat=c; render(); }
function openSheet(m){ sheet=true; mode=m; render(); }
function closeSheet(){ sheet=null; render(); }
function setMode(m){ mode=m; render(); }

// ── Init ──────────────────────────────────────────────────
render();
loadCatalog();
sbAuth.auth.onAuthStateChange((_event, sess)=>{ session = sess; loadAuthAndHousehold(); });
loadAuthAndHousehold();
setInterval(loadShoppingList, 5000);
</script>
</body>

<!-- redeploy-trigger -->
</html>
