function getWeekInfo() {
  const now = new Date();
  const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const ftDay = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - ftDay + 3);
  const week = 1 + Math.round((d - firstThursday) / (7 * 24 * 3600 * 1000));
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  const fmt = dt => dt.toLocaleDateString('sv-SE', { day: 'numeric', month: 'short' });
  return { week, range: `${fmt(monday)}–${fmt(sunday)}` };
}

function normalize(s){ return (s||'').toLowerCase().replace(/[åä]/g,'a').replace(/ö/g,'o').replace(/[-_,.]/g,' ').trim(); }

function searchDeals(){
  const el = document.getElementById('deal_search');
  searchInput = el ? el.value.trim() : searchInput;
  if(!searchInput) return;
  const terms = searchInput.split(/[,\n]+/).map(t=>t.trim()).filter(Boolean);
  searchResults = terms.map(term => {
    const n = normalize(term);
    const hits = deals.filter(d => {
      const dp = normalize(d.product), dd = normalize(d.detail||'');
      return n.split(' ').every(w => dp.includes(w) || dd.includes(w));
    }).sort((a,b) => ((b.origPrice-b.price)/(b.origPrice||1)) - ((a.origPrice-a.price)/(a.origPrice||1)));
    return { term, hits };
  });
  searchDone = true;
  render();
}

async function loadShoppingList(){
  if (Date.now() - lastLocalWrite < 3500) return;
  if(!session || !household){ if(shoppingList.length){ shoppingList=[]; render(); } return; }
  try{
    const data = await supa.selectRaw(`shopping_list?select=*&household_id=eq.${household.id}`);
    if(!Array.isArray(data)) return;
    const hash = JSON.stringify(data.map(r=>[r.id,r.checked,r.qty]).sort());
    if(hash===lastDataHash) return;
    lastDataHash = hash;
    shoppingList = data.map(r=>({ id:r.id, store:r.store, product:r.product, detail:r.detail, price:r.price, origPrice:r.orig_price, unit:r.unit, category:r.category, emoji:r.emoji, checked:r.checked, qty:r.qty||1, isCustom:r.is_custom||false }));
    render();
  }catch(e){ /* offline/förhandsvisning – synkar live */ }
}
function inList(id){ return shoppingList.some(i=>i.id===id); }
async function addOffer(id){
  if(!session || !household){ tab='lista'; render(); return; }
  const o = deals.find(d=>d.id===id); if(!o||inList(id)) return;
  const item = { id:o.id, store:o.store, product:o.product, detail:o.detail, price:o.price, origPrice:o.origPrice, unit:o.unit, category:o.category, emoji:o.emoji, checked:false, qty:1, isCustom:false };
  shoppingList.push(item); markWrite(); render();
  try{ await supa.insert('shopping_list', { id:item.id, household_id:household.id, added_by:session.user.id, store:item.store, product:item.product, detail:item.detail, price:item.price, orig_price:item.origPrice, unit:item.unit, category:item.category, emoji:item.emoji, checked:false, qty:1, is_custom:false }); }catch(e){ /* tyst */ }
}
async function toggleItem(id){
  const it = shoppingList.find(i=>i.id===id); if(!it) return;
  it.checked = !it.checked; markWrite(); render();
  try{ await supa.update('shopping_list', id, { checked: it.checked }); }catch(e){ /* tyst */ }
}
async function removeItem(id){
  shoppingList = shoppingList.filter(i=>i.id!==id); markWrite(); render();
  try{ await supa.delete('shopping_list', id); }catch(e){ /* tyst */ }
}
async function submitCustom(){
  if(!session || !household){ sheet=null; tab='lista'; render(); return; }
  const name=(document.getElementById('f_name')||{}).value||'';
  if(!name.trim()) return;
  const store=(document.getElementById('f_store')||{}).value||'ovrigt';
  const c=(document.getElementById('f_cat')||{}).value||'Mejeri & Övrigt';
  const qty=Math.max(1, parseInt((document.getElementById('f_qty')||{}).value||'1')||1);
  const id = Date.now();
  const item = { id, store, product:name.trim(), detail:'', price:0, origPrice:0, unit:'', category:c, emoji:CAT_EMOJI[c]||'🛒', checked:false, qty, isCustom:true };
  shoppingList.push(item); markWrite(); sheet=null; tab='lista'; render();
  try{ await supa.insert('shopping_list', { id, household_id:household.id, added_by:session.user.id, store, product:item.product, detail:'', price:0, orig_price:0, unit:'', category:c, emoji:item.emoji, checked:false, qty, is_custom:true }); }catch(e){ /* tyst */ }
}
async function submitOffer(){
  const name=(document.getElementById('f_name')||{}).value||'';
  const saleV=(document.getElementById('f_sale')||{}).value||'';
  if(!name.trim()||!saleV) return;
  const store=(document.getElementById('f_store')||{}).value||'';
  const details=(document.getElementById('f_details')||{}).value||'';
  const c=(document.getElementById('f_cat')||{}).value||'Mejeri & Övrigt';
  const sale=Number(saleV); const ord=Number((document.getElementById('f_ord')||{}).value)||sale;
  const id = Date.now();
  deals.unshift({ id, store:store||'ovrigt', product:name.trim(), detail:details||'Eget tillägg', price:sale, origPrice:ord, unit:'st', category:c, emoji:CAT_EMOJI[c]||'🛒', hot:false });
  sheet=null; tab='erbjudanden'; cat='Alla'; render();
}

function areaSwitcher(){
  if(AREAS.length < 2) return '';

}

  if(/matv.rlden vip|vip-pris/i.test(d+p))                return {label:'Kräver Matvärlden VIP',color:'#5A2D8A',bg:'#EDE3F8'};
  if(/hemköp plus|hemkop plus/i.test(d+p))                return {label:'Kräver Hemköp Plus',color:'#8A1A5A',bg:'#F8DEEE'};

  return null;
}

function renderStoreMap(){
  const el = document.getElementById('vf-map');
  if(!el || typeof L === 'undefined' || !ALL_STORES.length) return;
  if(vfMap){ try{ vfMap.remove(); }catch(e){} vfMap = null; }
  vfMap = L.map('vf-map', {scrollWheelZoom:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(vfMap);
  vfMapMarkers = {};
  const pts = [];
  ALL_STORES.forEach(st=>{
    if(st.lat==null || st.lng==null) return;
    pts.push([st.lat, st.lng]);
    const followed = followedStoreIds.has(st.id);
    const icon = L.divIcon({className:'', html:`<div class="vf-pin" style="background:${followed?'#E0552E':st.color};"><span>${followed?'✓':(st.logo||'🛒')}</span></div>`, iconSize:[30,30], iconAnchor:[15,30]});
    const marker = L.marker([st.lat, st.lng], {icon}).addTo(vfMap);
    marker.bindPopup(`<b>${esc(st.name)}</b><br>${followed?'Följs — klicka för att sluta följa':'Klicka på nålen för att följa'}`);
    marker.on('click', ()=>toggleFollow(st.id));
    vfMapMarkers[st.id] = marker;
  });
  if(pts.length) vfMap.fitBounds(pts, {padding:[24,24], maxZoom:14});
  setTimeout(()=>vfMap && vfMap.invalidateSize(), 80);
}

  }).join('');
  return hh + searchBox + `<div style="background:#2A211A;color:#fff;border-radius:20px;padding:18px 20px;display:flex;align-items:center;gap:16px;margin-bottom:18px;box-shadow:0 10px 24px rgba(42,33,26,.22);">
      <div style="flex:1;"><div style="font-size:12.5px;opacity:.65;">${shoppingList.length} varor att handla</div><div style="font-family:${DISP};font-weight:800;font-size:32px;line-height:1;margin-top:4px;">${kr(totalPrice)}</div></div>
      <div style="text-align:right;"><div style="font-size:11px;opacity:.65;text-transform:uppercase;letter-spacing:.04em;">Du sparar</div><div style="font-family:${DISP};font-weight:800;font-size:22px;color:#9FD27E;margin-top:3px;">-${kr(totalSaved)}</div></div>
    </div>${groups}`;
}
function renderSearchResults(){
  if(!searchResults || !searchResults.length) return '';
  const found = searchResults.filter(r=>r.hits.length>0);
  const notFound = searchResults.filter(r=>r.hits.length===0);

  // Bygg en butikskarta: vilken butik täcker flest söktermer?
  const storeScore = {};
  found.forEach(r => {
    const best = r.hits[0]; // bäst rabatt för denna term
    storeScore[best.store] = (storeScore[best.store]||0) + 1;
  });
  const bestStore = Object.entries(storeScore).sort((a,b)=>b[1]-a[1])[0];

  const foundRows = found.map(r => {
    const best = r.hits[0];
    const st = storeById(best.store);
    const disc = best.origPrice > best.price ? `<span style="color:#E0552E;font-weight:800;font-size:11px;margin-left:6px;">-${Math.round((1-best.price/best.origPrice)*100)}%</span>` : '';
    const already = inList(best.id);
    const btn = already
      ? `<span style="font-size:11px;color:#4F7A3F;font-weight:700;">✓ Tillagd</span>`
      : `<button onclick="addSearchHit(${best.id})" style="padding:5px 12px;border:none;border-radius:9px;background:#2A211A;color:#fff;font-weight:700;font-size:12px;font-family:${FAM};cursor:pointer;">+ Lägg till</button>`;
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #F3ECDF;">
      <span style="font-size:20px;">${best.emoji||'🛒'}</span>
      <div style="flex:1;min-width:0;">
        <div style="font-weight:700;font-size:13.5px;">${esc(best.product)}${disc}</div>
        <div style="font-size:11.5px;color:#8A7E6E;margin-top:1px;">${esc(st.name)} · ${kr(best.price)}${unitSuffix(best.unit)}</div>
      </div>
      ${btn}
    </div>`;
  }).join('');

  const notFoundRows = notFound.length ? `<div style="padding:10px 14px;font-size:12.5px;color:#B6A893;">
    Inga fynd: ${notFound.map(r=>`<b>${esc(r.term)}</b>`).join(', ')}
  </div>` : '';

  const tipRow = bestStore && storeScore[bestStore[0]] > 1
    ? `<div style="margin-top:10px;background:#EAF1E3;border-radius:12px;padding:10px 14px;font-size:12.5px;color:#3E6632;font-weight:700;">
        💡 ${esc(storeById(bestStore[0]).name)} täcker ${bestStore[1]} av dina sökta varor
      </div>` : '';

  return `<div style="background:#fff;border:1px solid #EFE6D8;border-radius:18px;overflow:hidden;margin-bottom:4px;box-shadow:0 2px 10px rgba(42,33,26,.04);">
    <div style="padding:12px 14px 8px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#8A7E6E;">
      ${found.length} fynd hittade • ${notFound.length} saknas denna vecka
    </div>
    ${foundRows}${notFoundRows}
  </div>${tipRow}`;
}
function toggleDesc(uid){
  const el = document.getElementById('desc_'+uid);
  const btn = document.getElementById('descbtn_'+uid);
  if(!el||!btn) return;
  const expanded = el.dataset.expanded === '1';
  if(expanded){
    el.style.webkitLineClamp = '2';
    el.style.overflow = 'hidden';
    el.dataset.expanded = '0';
    btn.textContent = 'Läs mer…';
  } else {
    el.style.webkitLineClamp = 'unset';
    el.style.overflow = 'visible';
    el.dataset.expanded = '1';
    btn.textContent = 'Visa mindre';
  }
}
let recipeCardSeq = 0;
function recipeCard(r){
  const uid = 'r' + (recipeCardSeq++);
  const usedIds = new Set(r.dealIdsUsed||[]);
  const descHtml = r.description ? `<div style="margin-bottom:12px;">
      <span id="desc_${uid}" data-expanded="0" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:#5A4F43;line-height:1.5;">${esc(r.description)}</span>
      <span id="descbtn_${uid}" onclick="toggleDesc('${uid}')" style="display:inline-block;margin-top:4px;color:#4F7A3F;font-weight:700;cursor:pointer;font-size:12.5px;">Läs mer…</span>
    </div>` : '';
  const ingRows = (r.ingredients||[]).map(ing=>{
    const d = ing.fromDealId!=null ? deals.find(x=>x.id===ing.fromDealId) : null;
    const tag = d ? `<span style="margin-left:auto;flex:none;font-size:11px;font-weight:700;color:#3E6632;background:#EAF1E3;padding:3px 8px;border-radius:8px;">${esc(storeById(d.store).name)} · ${kr(d.price)}${unitSuffix(d.unit)}</span>` : '';
    return `<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #F3ECDF;font-size:13.5px;"><span>${esc(ing.amount||'')} ${esc(ing.name||'')}</span>${tag}</div>`;
  }).join('');
  const steps = (r.steps||[]).map((s,i)=>`<div style="display:flex;gap:10px;padding:6px 0;font-size:13.5px;line-height:1.5;"><span style="flex:none;width:22px;height:22px;border-radius:50%;background:#F0E8DA;color:#6A5E50;font-weight:800;font-size:11.5px;display:flex;align-items:center;justify-content:center;">${i+1}</span><span>${esc(s)}</span></div>`).join('');
  return `<div style="background:#fff;border:1px solid #EFE6D8;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(42,33,26,.04);">
    <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:4px;">
      <div style="flex:1;font-family:${DISP};font-weight:800;font-size:18px;line-height:1.2;">${esc(r.title||'Recept')}</div>
      <div style="flex:none;font-size:11.5px;font-weight:700;color:#C2431F;background:#FBEAE2;padding:5px 9px;border-radius:9px;">${usedIds.size} fynd använda</div>
    </div>
    <div style="font-size:12.5px;color:#8A7E6E;margin-bottom:10px;">${r.servings?`${r.servings} port · `:''}${r.estimatedTotalCost!=null?`ca ${kr(r.estimatedTotalCost)} totalt`:''}</div>
    ${descHtml}
    <div style="margin-bottom:10px;">${ingRows}</div>
    <div>${steps}</div>
  </div>`;
}
async function generateRecipes(){
  const val = document.getElementById('recipe_q');
  recipeQuery = val ? val.value : recipeQuery;
  recipeLoading = true; recipeError = null; recipeResult = null;
  render();
  try{
    const res = await fetch(`${SUPA_URL}/functions/v1/generate-recipe`, {
      method:'POST', headers: await authHeaders(),
      body: JSON.stringify({ deals: deals, request: recipeQuery })
    });
    const data = await res.json();
    if(!res.ok || data.error){ recipeError = data.error || 'Något gick fel, försök igen.'; }
    else { recipeResult = data; }
  }catch(e){ recipeError = 'Kunde inte nå AI-tjänsten. Kontrollera anslutningen.'; }
  recipeLoading = false;
  render();
}
function viewRecipes(){
  const intro = `<div style="background:linear-gradient(135deg,#4F7A3F,#3E6632);border-radius:22px;padding:20px 22px;color:#fff;margin-bottom:18px;box-shadow:0 12px 28px rgba(79,122,63,.26);">
      <div style="font-size:13px;opacity:.92;font-weight:600;">🍳 ${PRESET_RECIPES.length} recept från veckans fynd</div>
      <div style="font-size:13.5px;opacity:.92;margin-top:6px;line-height:1.5;">Här är ${PRESET_RECIPES.length} recept byggda på veckans erbjudanden. Vill du ha något specifikt? Skriv en önskan nedan så bygger AI:n ett skräddarsytt recept åt dig.</div>
    </div>`;
  const inputRow = `<div style="display:flex;gap:10px;margin-bottom:22px;">
      <input id="recipe_q" value="${esc(recipeQuery)}" placeholder="t.ex. 4 personer, snabb vardagsmat…" style="${inputStyle()}" ${recipeLoading?'disabled':''}>
      <button onclick="generateRecipes()" ${recipeLoading?'disabled':''} style="flex:none;padding:0 20px;border:none;border-radius:12px;background:${recipeLoading?'#B6A893':'#4F7A3F'};color:#fff;font-weight:700;font-size:14px;font-family:${FAM};cursor:${recipeLoading?'default':'pointer'};">${recipeLoading?'Skapar…':'Skapa eget'}</button>
    </div>`;
  let aiBody = '';
  if(recipeLoading){
    aiBody = `<div style="text-align:center;padding:40px 0;color:#8A7E6E;font-size:14px;">🍳 AI:n läser igenom ${deals.length} erbjudanden och bygger recept…</div>`;
  } else if(recipeError){
    aiBody = `<div style="background:#FBEAE2;color:#C2431F;border-radius:16px;padding:16px;font-size:14px;margin-bottom:18px;">⚠️ ${esc(recipeError)}</div>`;
  } else if(recipeResult && Array.isArray(recipeResult.recipes)){
    aiBody = `<div style="font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#8A7E6E;margin-bottom:10px;">✨ Ditt skräddarsydda recept</div>` + recipeResult.recipes.map(recipeCard).join('') + `<div style="height:6px;"></div>`;
  }
  const presetHeader = `<div style="font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#8A7E6E;margin-bottom:10px;">📖 Veckans receptbibliotek</div>`;
  const presetBody = PRESET_RECIPES.map(recipeCard).join('');
  return intro + inputRow + aiBody + presetHeader + presetBody;
}
function inputStyle(){ return `width:100%;padding:12px;border-radius:12px;border:1px solid #E3D8C6;background:#fff;font-size:15px;font-family:${FAM};color:#2A211A;outline:none;`; }
function storeOptions(){ return STORES.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join(''); }
function catOptions(){ return CAT_ORDER.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join(''); }
function seg(on){ return `flex:1;padding:10px;border-radius:11px;border:none;background:${on?'#fff':'transparent'};color:${on?'#2A211A':'#8A7E6E'};font-weight:${on?700:600};font-size:13.5px;cursor:pointer;font-family:${FAM};box-shadow:${on?'0 2px 6px rgba(0,0,0,.07)':'none'};`; }
function lbl(t){ return `<span style="font-size:12.5px;font-weight:700;color:#6A5E50;display:block;margin-bottom:6px;">${t}</span>`; }
function sheetView(){
  if(!sheet) return '';
  const erb = mode==='erbjudande';
  const body = erb ? `
    <div style="font-size:13px;color:#8A7E6E;margin:10px 2px 16px;">Lägg till ett fynd du hittat i veckan.</div>
    <label style="display:block;margin-bottom:13px;">${lbl('Butik')}<select id="f_store" style="${inputStyle()}"><option value="">Välj butik…</option>${storeOptions()}</select></label>
    <label style="display:block;margin-bottom:13px;">${lbl('Produkt')}<input id="f_name" placeholder="t.ex. Kycklingfilé 900g" style="${inputStyle()}"></label>
    <label style="display:block;margin-bottom:13px;">${lbl('Detaljer')}<input id="f_details" placeholder="t.ex. fryst, 2-pack" style="${inputStyle()}"></label>
    <label style="display:block;margin-bottom:13px;">${lbl('Kategori')}<select id="f_cat" style="${inputStyle()}">${catOptions()}</select></label>
    <div style="display:flex;gap:12px;margin-bottom:18px;">
      <label style="flex:1;">${lbl('Rea-pris (kr)')}<input id="f_sale" type="number" inputmode="decimal" placeholder="59" style="${inputStyle()}"></label>
      <label style="flex:1;">${lbl('Ordinarie (kr)')}<input id="f_ord" type="number" inputmode="decimal" placeholder="89" style="${inputStyle()}"></label>
    </div>
    <div style="display:flex;gap:10px;">
      <button onclick="closeSheet()" style="flex:none;padding:13px 18px;border:1px solid #E3D8C6;border-radius:14px;background:#fff;color:#6A5E50;font-weight:700;font-size:15px;font-family:${FAM};cursor:pointer;">Avbryt</button>
      <button onclick="submitOffer()" style="flex:1;padding:13px;border:none;border-radius:14px;background:#E0552E;color:#fff;font-weight:700;font-size:15px;font-family:${FAM};cursor:pointer;">✅ Lägg till erbjudande</button>
    </div>` : `
    <div style="font-size:13px;color:#8A7E6E;margin:10px 2px 16px;">För saker som inte är på rea, t.ex. mjölk eller bröd.</div>
    <label style="display:block;margin-bottom:13px;">${lbl('Vara')}<input id="f_name" placeholder="t.ex. Mjölk 1,5 L" style="${inputStyle()}"></label>
    <label style="display:block;margin-bottom:13px;">${lbl('Butik')}<select id="f_store" style="${inputStyle()}"><option value="ovrigt">Valfri butik</option>${storeOptions()}</select></label>
    <div style="display:flex;gap:12px;margin-bottom:18px;">
      <label style="flex:1;">${lbl('Kategori')}<select id="f_cat" style="${inputStyle()}">${catOptions()}</select></label>
      <label style="width:96px;flex:none;">${lbl('Antal')}<input id="f_qty" type="number" inputmode="numeric" min="1" value="1" style="${inputStyle()}"></label>
    </div>
    <div style="display:flex;gap:10px;">
      <button onclick="closeSheet()" style="flex:none;padding:13px 18px;border:1px solid #E3D8C6;border-radius:14px;background:#fff;color:#6A5E50;font-weight:700;font-size:15px;font-family:${FAM};cursor:pointer;">Avbryt</button>
      <button onclick="submitCustom()" style="flex:1;padding:13px;border:none;border-radius:14px;background:#4F7A3F;color:#fff;font-weight:700;font-size:15px;font-family:${FAM};cursor:pointer;">✅ Lägg till på listan</button>
    </div>`;
  return `<div onclick="closeSheet()" style="position:fixed;inset:0;z-index:40;background:rgba(42,33,26,.45);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:vfFade .2s ease;">
    <div onclick="event.stopPropagation()" style="width:100%;max-width:520px;background:#FBF6EE;border-radius:26px 26px 0 0;padding:18px clamp(16px,4vw,24px) 30px;animation:vfSheet .3s cubic-bezier(.22,1,.36,1);max-height:92vh;overflow:auto;">
      <div style="width:40px;height:4px;background:#E0D5C2;border-radius:3px;margin:0 auto 16px;"></div>
      <div style="display:flex;background:#F0E8DA;border-radius:14px;padding:4px;margin-bottom:8px;">
        <button onclick="setMode('erbjudande')" style="${seg(erb)}">🏷️ Erbjudande</button>
        <button onclick="setMode('vara')" style="${seg(!erb)}">🛒 Egen vara</button>
      </div>${body}
    </div></div>`;
}
function fab(){ return `<button onclick="openSheet('erbjudande')" style="position:fixed;right:clamp(16px,4vw,28px);bottom:calc(24px + env(safe-area-inset-bottom));z-index:30;height:54px;padding:0 22px;border:none;border-radius:17px;background:#E0552E;color:#fff;font-family:${DISP};font-weight:700;font-size:16px;box-shadow:0 10px 26px rgba(224,85,46,.42);cursor:pointer;display:flex;align-items:center;gap:8px;">✏️ Erbjudande</button>`; }

function render(){
  const main = tab==='erbjudanden'?viewOffers():tab==='butiker'?viewStores():tab==='recept'?viewRecipes():viewList();
  document.getElementById('app').innerHTML =
    header() +
    `<main style="${PAGE}padding-bottom:96px;animation:vfFade .3s ease;">${main}</main>` +
    fab() + sheetView();
  if(tab==='butiker' && !catalogLoading) setTimeout(renderStoreMap, 0);
}
function go(t){ tab=t; if(t!=='erbjudanden') cat='Alla'; render(); }
function setCat(c){ cat=c; render(); }
function openSheet(m){ sheet=true; mode=m; render(); }
function closeSheet(){ sheet=null; render(); }
function setMode(m){ mode=m; render(); }

// ── Init ──────────────────────────────────────────────────
render();
loadCatalog();
sbAuth.auth.onAuthStateChange((_event, sess)=>{ session = sess; loadAuthAndHousehold(); });
loadAuthAndHousehold();
setInterval(loadShoppingList, 5000);
</script>
